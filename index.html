<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Will's Casino</title><meta name="theme-color" content="#3b5bff">
<style>
:root{--bg:#e6ebf5;--card:#fff;--tx:#1b2030;--mu:#5d6680;--ac:#00b06f;--bad:#e03a3a;--bd:#cfd7e8;--btn:#e9eefa;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

button{cursor:pointer}button:hover{filter:brightness(1.08)}button:disabled{opacity:.45;cursor:default}
nav button{white-space:nowrap}nav .on{background:var(--ac);color:#fff;border-color:var(--ac)}

.big{font-size:44px;text-align:center;min-height:62px;margin:8px 0}

.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.grid button{aspect-ratio:1;font-size:22px;padding:0}

.hero{margin:12px 0;border-radius:16px;padding:18px;background:linear-gradient(120deg,#ff7a18,#ff3d81 55%,#8a3bff);color:#fff;display:flex;justify-content:space-between;align-items:center;overflow:hidden;box-shadow:0 4px 0 rgba(0,0,0,.25)}

.gi{padding:8px 10px}.gi b{display:block}.gi small{display:flex;justify-content:space-between}

.card{border-width:2px;box-shadow:0 3px 0 rgba(0,0,0,.15)}
button{border-radius:10px;font-weight:600}.go{box-shadow:0 3px 0 rgba(0,0,0,.25)}
.rt{flex:0 0 64px;height:64px;border-right:1px solid #000;box-sizing:border-box}.rb{width:30%;min-width:96px;padding:14px 6px;font-weight:900;font-size:17px;color:#000;border:2px solid #000;border-radius:6px;box-shadow:0 3px 0 rgba(0,0,0,.35)}.rb small{display:block;color:inherit;opacity:.8}
.rh{width:22px;height:22px;border:1px solid #000;border-radius:4px;display:inline-block}
.chip{width:54px;height:54px;border-radius:50%;padding:0;font-weight:900;color:#fff;border:4px dashed rgba(255,255,255,.75);box-shadow:0 3px 0 rgba(0,0,0,.35)}.chip.on{outline:3px solid var(--ac);outline-offset:2px;transform:translateY(-3px)}.rstat{text-align:center;font-weight:800;font-size:18px;margin:6px 0}.bar{height:8px;border-radius:99px;background:var(--btn);overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);width:100%}.rb small{font-size:12px;font-weight:600}
.pf{display:flex;align-items:center;gap:8px;cursor:pointer;background:rgba(0,0,0,.3);border-radius:99px;padding:3px 12px 3px 3px;max-width:44%;color:#fff;font-weight:700}.pf span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:520px){.lt{display:none}}

.md{background:var(--card);border-radius:16px;padding:18px;width:100%;max-width:380px;max-height:90vh;overflow:auto;border:2px solid var(--bd)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.stats div{background:var(--btn);border-radius:10px;padding:8px 10px}.stats small,.stats b{display:block}
.sw{width:30px;height:30px;border-radius:50%;cursor:pointer;border:2px solid var(--bd)}
.cm{padding:3px 0;font-size:15px;word-break:break-word}.nl{cursor:pointer;display:inline-flex;align-items:center;gap:4px;vertical-align:middle}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:99px;opacity:0;transition:opacity .3s;z-index:30;pointer-events:none;font-weight:600;max-width:90%;text-align:center}
.who{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;align-items:center;min-height:28px;margin-top:6px}.who span{cursor:pointer;display:inline-flex}
.col{width:30%;min-width:96px;display:flex;flex-direction:column;align-items:center}.col .rb{width:100%}
#sb{position:fixed;left:0;top:calc(env(safe-area-inset-top,0px) + 56px);bottom:0;width:min(280px,85vw);background:var(--card);border-right:2px solid var(--bd);z-index:8;display:flex;flex-direction:column;padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));transition:transform .25s}#sb.h{transform:translateX(-105%)}
.sbh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}#chat{flex:1;overflow:auto}
#sbt{position:fixed;left:0;top:45%;z-index:7;border-radius:0 12px 12px 0;padding:12px 10px;font-size:20px}body.co #sbt{display:none}
@media(min-width:900px){body.co main{margin-left:296px}}
.gold{background:linear-gradient(90deg,#f7c948,#ffe27a);color:#3b2a00;border-radius:8px;padding:5px 8px;margin:4px 0;font-weight:700}
.bail{background:#f7c948;color:#3b2a00;border-radius:12px;padding:10px 14px;margin:10px 0;display:flex;gap:10px;align-items:center;justify-content:space-between;font-weight:700}.bail[hidden]{display:none}
.adm{padding:4px 10px;border-radius:99px}
.coin{width:170px;height:170px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:84px;font-weight:900;color:#5a3d00;background:radial-gradient(circle at 35% 30%,#fff3b0,#f5b800 55%,#b8860b);border:6px solid #b8860b;box-shadow:0 8px 0 rgba(0,0,0,.3)}
.coin.fl{animation:cf 1.1s ease-out}@keyframes cf{0%{transform:translateY(0) rotateX(0)}50%{transform:translateY(-70px) rotateX(900deg)}100%{transform:translateY(0) rotateX(1800deg)}}
.stage{height:250px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;perspective:900px;margin:10px 0}
.tw{width:170px;height:170px;transform-style:preserve-3d}.tw.toss{animation:ts 3.4s ease-in-out}
.cw{width:100%;height:100%;transform-style:preserve-3d;transform:rotateY(-14deg)}
.cn{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform 3.4s cubic-bezier(.08,.7,.15,1)}
.face,.ed{position:absolute;inset:0;border-radius:50%}
.face{backface-visibility:hidden;display:flex;align-items:center;justify-content:center;font-size:92px;font-weight:900;border:8px solid rgba(0,0,0,.25);box-shadow:inset 0 0 24px rgba(0,0,0,.25)}
.fh{background:radial-gradient(circle at 35% 30%,#fff6b8,#ffd21f 50%,#d9a400);color:#7a5600;transform:translateZ(5px)}
.ft{background:radial-gradient(circle at 35% 30%,#cfe6ff,#3b82f6 50%,#1d4ed8);color:#0b2a6b;transform:rotateX(180deg) translateZ(5px)}
.ed{background:#7d7a4a}
.sh{width:120px;height:14px;border-radius:50%;background:rgba(0,0,0,.28);margin-top:14px;filter:blur(3px)}.sh.toss{animation:sw 3.4s ease-in-out}
@keyframes ts{0%{transform:translateY(0)}30%{transform:translateY(-110px)}65%{transform:translateY(-45px)}100%{transform:translateY(0)}}
@keyframes sw{30%{transform:scale(.55);opacity:.4}65%{transform:scale(.8)}}
</style></head><body><div class="top"><div class="pf" id="pf" onclick="openP(ME())"></div><div class="logo" onclick="logo()">🎰<span class="lt"> WILL'S <b>CASINO</b></span></div><div style="display:flex;gap:8px;align-items:center"><button id="adm" class="adm" hidden onclick="openAdmin()">🛠</button><div class="pill">💰 <span id="bal"></span></div></div></div>
<main>
<div class="bail" id="bail" hidden><span>💸 You're out of money!</span><button class="go" onclick="bail()">Claim $100</button></div>
<section id="home"><div class="hero"><div><h2>Welcome to Will's Casino!</h2><p id="hp">100% fake money · free $10,000 every new day</p></div><div class="coins">🪙💎🎲</div></div>
<h3>🔥 Popular Games</h3><div class="shelf" id="shelf"></div></section>
<section id="play" hidden><button class="back" onclick="goHome()">◀ All Games</button><div class="card" id="bc"><div class="row"><b>Bet $</b><input id="bet" type="number" min="1" value="100" inputmode="decimal"><button onclick="bm(.5)">½</button><button onclick="bm(2)">2×</button><button onclick="bm(0)">Max</button></div></div><div id="msg" style="min-height:24px;margin:0 4px 8px"></div><div class="card" id="game"></div></section>
</main><aside id="sb" class="h"><div class="sbh"><b>💬 Chat <small id="cn"></small></b><button onclick="cs(0)">✕ Hide</button></div><div id="onl" class="who" style="justify-content:flex-start"></div><div id="chat"></div><div id="cnote"></div><div class="row"><input id="ci" maxlength="200" placeholder="Say something…" style="flex:1;min-width:0" onkeydown="if(event.key=='Enter')csend()"><button class="go" onclick="csend()">Send</button></div></aside><button id="sbt" onclick="cs(1)">💬</button>
<div class="ov" id="ov" hidden></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),R=Math.random,F=n=>'$'+(Math.round(n*100)/100).toLocaleString(undefined,{maximumFractionDigits:2});
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),cl=c=>/^#[0-9a-f]{6}$/i.test(c)?c:'#888888',sid=k=>String(k).replace(/[^\w-]/g,'');
const av=(c,z=32)=>`<svg width=${z} height=${z} viewBox="0 0 32 32" style="border-radius:50%;background:${cl(c)};flex:none"><circle cx=16 cy=12 r=5.5 fill="#fff" opacity=".92"/><path d="M5 29c0-6 5-10 11-10s11 4 11 10z" fill="#fff" opacity=".92"/></svg>`;
const PC=['#e11d48','#f97316','#eab308','#22c55e','#06b6d4','#3b82f6','#8b5cf6','#ec4899','#14b8a6','#64748b'];
let TOK=null,AK='',MY={id:'',name:'…',color:'#888888',bal:0,games:0,wag:0,big:0,pg:{},lost:0,rbc:0},BAL=0,PL={},CHT=[],RH=[],skew=0,cur='',sp=0,cr=null,mn=null,bj=null,rb={r:0,g:0,b:0},BT={},RL={id:0,spin:null,b:[]},rp='',rx=0,ra=100,rt=0,tmpc='',tt=0,lk=0,lt=0,cang=0;
try{TOK=localStorage.getItem('tok');AK=sessionStorage.getItem('ak')||''}catch(e){}
const V={},I={},ME=()=>MY.id,mine=k=>k==MY.id,PP=k=>mine(k)?MY:PL[k],nm=k=>(PP(k)&&PP(k).name)||'Player',col=k=>PP(k)&&PP(k).color,nl=k=>`<a class=nl onclick="openP('${sid(k)}')">${av(col(k),20)}<b>${esc(nm(k))}</b></a>`;
async function api(path,body){const r=await fetch('/api/'+path,{method:'POST',headers:{'content-type':'application/json','x-token':TOK||''},body:JSON.stringify(body||{})});let j;try{j=await r.json()}catch(e){j={err:'Network error'}}if(!r.ok)throw j.err||'Error';if(typeof j.bal=='number'&&path!='admin'&&!sp)MY.bal=j.bal;return j}
const say=(m,c)=>{$('#msg').textContent=m;$('#msg').className=c||''};
function toast(t,g){const e=$('#toast');e.style.background=g?'linear-gradient(90deg,#f7c948,#ffe27a)':'#111';e.style.color=g?'#3b2a00':'#fff';e.textContent=t;e.style.opacity=1;clearTimeout(tt);tt=setTimeout(()=>e.style.opacity=0,3500)}
const busy=()=>cr||(mn&&mn.on)||(bj&&bj.on)||sp||rb.r+rb.g+rb.b>0;
function setBal(x){BAL=Math.round(x*100)/100;MY.bal=BAL;$('#bal').textContent=F(BAL);setTimeout(bailChk,60)}
function bailChk(){$('#bail').hidden=!(BAL<1&&!busy()&&TOK)}
async function bail(){try{const r=await api('bail');setBal(r.bal);toast('Here is $100 to get you going 🍀')}catch(e){toast(e)}}
function bet(){const b=Math.round(+$('#bet').value*100)/100;if(!(b>0))return say('Enter a bet','bad'),0;if(b>BAL)return say('Not enough money','bad'),0;return b}
function bm(x){$('#bet').value=x?Math.max(1,Math.floor(+$('#bet').value*x*100)/100):Math.floor(BAL*100)/100}
async function go(path,body,b){setBal(BAL-b);try{return await api(path,body)}catch(e){setBal(BAL+b);say(e,'bad');return null}}
function done(b,r,t){const p=r.pay||0;setBal(r.bal);say((t?t+' · ':'')+(p>b?'Won '+F(p-b):p==b?'Push':'Lost '+F(b-p)),p>=b?'ok':'bad')}
// ---- COIN
V['Coin Flip']=`<h2>Coin Flip</h2><p>Pick a side. Pays 1.96×. <b style="color:#d9a400">Heads = yellow</b>, <b style="color:#2563eb">Tails = blue</b></p><div class=stage><div class=tw id=tw><div class=cw><div class=cn id=cn><div class="face fh">H</div><div class="face ft">T</div>${[...Array(9)].map((_,i)=>`<div class=ed style="transform:translateZ(${i-4}px)"></div>`).join('')}</div></div></div><div class=sh id=sh></div></div><div class=row style="justify-content:center"><button class=go style="background:#d9a400;border-color:#b8860b" onclick="coin('Heads')">Heads</button><button class=go style="background:#2563eb;border-color:#1d4ed8" onclick="coin('Tails')">Tails</button></div>`;
async function coin(p){if(sp)return;const b=bet();if(!b)return;sp=1;const r=await go('coin',{side:p,amt:b},b);if(!r){sp=0;return}const cn=$('#cn'),tw=$('#tw'),sh=$('#sh');
cang=Math.ceil((cang+1800)/360)*360+(r.r=='Tails'?180:0);cn.style.transform=`rotateX(${cang}deg)`;tw.classList.remove('toss');sh.classList.remove('toss');tw.offsetWidth;tw.classList.add('toss');sh.classList.add('toss');
setTimeout(()=>{sp=0;done(b,r,r.r)},3600)}
// ---- DICE
V['Dice']=`<h2>Dice</h2><p>Roll 0–100. Pick your odds; lower chance = bigger payout.</p><div class=big id=o>🎲</div><div class=row><select id=dd onchange=du()><option value=u>Roll under</option><option value=o>Roll over</option></select><input id=dt type=range min=2 max=98 value=50 oninput=du()><b id=dl></b></div><button class=go onclick=dice()>Roll</button>`;
I['Dice']=()=>du();
function du(){const t=+$('#dt').value,u=$('#dd').value=='u',c=u?t:100-t;$('#dl').textContent=t+' → '+c+'% · '+(98/c).toFixed(2)+'×'}
async function dice(){if(sp)return;const b=bet();if(!b)return;sp=1;const r=await go('dice',{over:$('#dd').value=='o',t:+$('#dt').value,amt:b},b);sp=0;if(!r)return;$('#o').textContent=r.roll.toFixed(2);done(b,r)}
// ---- LIMBO
V['Limbo']=`<h2>Limbo</h2><p>Set a target multiplier. Win if the result reaches it.</p><div class=big id=o>—</div><div class=row><b>Target</b><input id=lt type=number value=2 min=1.01 step=0.01 style="width:90px"><button class=go onclick=limbo()>Play</button></div>`;
async function limbo(){if(sp)return;const t=+$('#lt').value;if(!(t>=1.01))return say('Target must be ≥ 1.01','bad');const b=bet();if(!b)return;sp=1;const r=await go('limbo',{t,amt:b},b);sp=0;if(!r)return;$('#o').textContent=r.r.toFixed(2)+'×';done(b,r)}
// ---- CRASH
V['Crash']=`<h2>Crash</h2><p>The multiplier climbs until it crashes. Cash out in time!</p><div class=big id=o>1.00×</div><button class=go id=cb onclick=crash()>Start</button>`;
async function crash(){if(cr){if(cr.q)return;cr.q=1;try{const r=await api('crash/cash'),a=cr.a;clearInterval(cr.i);cr=null;$('#cb').textContent='Start';if(r.crashed){$('#o').textContent='💥 '+r.cp.toFixed(2)+'×';done(a,r,'Crashed')}else{$('#o').textContent=r.m.toFixed(2)+'×';done(a,r,'Cashed out '+r.m.toFixed(2)+'×')}}catch(e){say(e,'bad');if(cr)cr.q=0}return}
const b=bet();if(!b)return;const r=await go('crash/start',{amt:b},b);if(!r)return;cr={a:b,t0:r.t0,q:0,pq:0,i:setInterval(crTick,100)};$('#cb').textContent='Cash out'}
async function crTick(){if(!cr)return;const m=Math.exp(.12*(Date.now()+skew-cr.t0)/1000);$('#o').textContent=m.toFixed(2)+'×';if(cr.pq||cr.q)return;cr.pq=1;try{const s=await api('crash/state');if(cr&&!s.on){clearInterval(cr.i);const a=cr.a;cr=null;$('#cb').textContent='Start';if(s.crashed){$('#o').textContent='💥 '+s.cp.toFixed(2)+'×';done(a,{bal:s.bal,pay:0},'Crashed')}}}catch(e){}if(cr)cr.pq=0}
// ---- MINES
V['Mines']=`<h2>Mines</h2><p>Reveal gems, dodge mines. Cash out any time.</p><div class=row><select id=mc><option>1</option><option selected>3</option><option>5</option><option>10</option><option>15</option><option>24</option></select><small>mines</small><button class=go id=mb onclick=mines()>Start</button><b id=mm></b></div><div class=grid id=mg></div>`;
function mdraw(){$('#mg').innerHTML=[...Array(25)].map((_,i)=>`<button ${mn&&mn.on&&!mn.r.has(i)&&!mn.q?'':'disabled'} onclick=mpick(${i})>${mn&&mn.r.has(i)?'💎':mn&&mn.k&&mn.k.includes(i)?'💣':'?'}</button>`).join('')}
I['Mines']=()=>{mn=null;mdraw()};
async function mines(){if(mn&&mn.on){if(!mn.r.size||mn.q)return;mn.q=1;try{const r=await api('mines/cash');mn.on=0;mn.k=r.k;mdraw();$('#mb').textContent='Start';done(mn.a,r,r.x.toFixed(2)+'×')}catch(e){say(e,'bad');mn.q=0}return}
const b=bet();if(!b)return;const r=await go('mines/start',{amt:b,m:+$('#mc').value},b);if(!r)return;mn={on:1,a:b,r:new Set(),q:0,k:null};$('#mb').textContent='Cash out';$('#mm').textContent='1.00×';mdraw()}
async function mpick(i){if(!mn||!mn.on||mn.q)return;mn.q=1;try{const r=await api('mines/pick',{i});mn.q=0;if(r.boom){mn.on=0;mn.k=r.k;mdraw();$('#mb').textContent='Start';return done(mn.a,{bal:r.bal,pay:0},'💣 Boom')}
mn.r.add(i);$('#mm').textContent=r.x.toFixed(2)+'×';if(r.done){mn.on=0;mn.k=r.k;mdraw();$('#mb').textContent='Start';return done(mn.a,r,r.x.toFixed(2)+'×')}mdraw()}catch(e){mn.q=0;say(e,'bad')}}
// ---- SLOTS
const SY=['🍒','🍋','🔔','⭐','💎','7️⃣'];
V['Slots']=`<h2>Slots</h2><p>3 of a kind pays big (4× to 75×). Any pair returns half.</p><div class=big id=o>🎰 🎰 🎰</div><button class=go onclick=slots()>Spin</button>`;
async function slots(){if(sp)return;const b=bet();if(!b)return;sp=1;const r=await go('slots',{amt:b},b);if(!r){sp=0;return}let n=0;const f=()=>[0,1,2].map(()=>SY[Math.floor(R()*6)]).join(' '),i=setInterval(()=>{$('#o').textContent=f();if(++n>10){clearInterval(i);$('#o').textContent=r.r.map(x=>SY[x]).join(' ');sp=0;done(b,r)}},70)}
// ---- BLACKJACK
const bc2=(v,i)=>({1:'A',11:'J',12:'Q',13:'K'}[v]||v)+'♠♥♦♣'[(v*3+i)%4],hs=(h,hide)=>h.map((v,i)=>{const t=bc2(v,i);return `<span class="${'♥♦'.includes(t.slice(-1))?'red':''}">${t}</span>`}).join(' ')+(hide?' 🂠':'');
V['Blackjack']=`<h2>Blackjack</h2><p>Dealer stands on 17. Blackjack pays 3:2.</p><div id=bt></div><div class=row><button class=go id=b0 onclick=bdeal()>Deal</button><button id=b1 onclick=bhit() disabled>Hit</button><button id=b2 onclick=bstand() disabled>Stand</button><button id=b3 onclick=bdbl() disabled>Double</button></div>`;
function bdraw(r){$('#bt').innerHTML=`<p>Dealer ${r.done?'('+r.dv+')':''}</p><div class=hand>${hs(r.d,!r.done)}</div><p>You (${r.pv})</p><div class=hand>${hs(r.p)}</div>`;$('#b0').disabled=!r.done&&bj&&bj.on;$('#b1').disabled=$('#b2').disabled=r.done;$('#b3').disabled=r.done||r.p.length>2||BAL<bj.a}
function bfin(r){bj.on=0;bdraw(r);done(bj.a,r,r.msg)}
async function bdeal(){if(bj&&bj.on)return;const b=bet();if(!b)return;const r=await go('bj/deal',{amt:b},b);if(!r)return;bj={a:b,on:1};if(r.done)return bfin(r);say('');bdraw(r)}
async function bact(p){if(!bj||!bj.on||bj.q)return;bj.q=1;try{const r=await api(p);bj.q=0;if(r.done)bfin(r);else bdraw(r)}catch(e){bj.q=0;say(e,'bad')}}
function bhit(){bact('bj/hit')}function bstand(){bact('bj/stand')}
async function bdbl(){if(!bj||!bj.on||bj.q||BAL<bj.a)return;setBal(BAL-bj.a);bj.a*=2;bj.q=1;try{const r=await api('bj/double');bj.q=0;bfin(r)}catch(e){bj.q=0;bj.a/=2;setBal(BAL+bj.a);say(e,'bad')}}
// ---- ROULETTE
const RC={r:'#f50f14',b:'#000',g:'#27ae4f'},RN={r:'RED',g:'GREEN',b:'BLACK'},RM={r:2,g:50,b:2},RW=64,CYC=20000,BET=15000,SPN=4600,CHP=[[10,'10','#6b7280'],[100,'100','#2563eb'],[1000,'1K','#16a34a'],[10000,'10K','#9333ea'],[100000,'100K','#e11d48']];
const col3=(c,bg,fg)=>`<div class=col><button class=rb id=b_${c} style="background:${bg};${fg?'color:'+fg:''}" onclick="rplace('${c}')"></button><div class=who id=w_${c}></div></div>`;
V['Roulette']=`<h2>Roulette</h2><p>Everyone shares the same roll, every 20s: 15s to bet, then it spins. Green is super rare (2%).</p><div id=rs class=rstat></div><div class=bar><i id=rbar></i></div>
<div style="position:relative;margin:28px 0 16px"><div style="position:absolute;left:50%;top:-24px;transform:translateX(-50%);font-size:24px;z-index:2;line-height:1">▼</div><div style="overflow:hidden;border:2px solid #000;border-radius:6px"><div id=rk style="display:flex"></div></div></div>
<div class=row style="justify-content:center">${CHP.map(c=>`<button class=chip data-v=${c[0]} style="background:${c[2]}" onclick="rset(${c[0]})">${c[1]}</button>`).join('')}</div>
<div class=row style="justify-content:center"><b>$</b><input id=ri type=number min=1 value=100 style="width:100px" oninput=rcust()><button onclick=rmul(.5)>½</button><button onclick=rmul(2)>2×</button><button onclick=rmax()>Max</button></div>
<div class=row style="justify-content:center;align-items:flex-start">${col3('r','#f50f14')}${col3('g','#27ae4f')}${col3('b','#000','#fff')}</div>
<div class=row style="justify-content:center"><button id=rc onclick=rclr()>Clear my bets</button></div>
<div style="margin-top:12px;display:flex;flex-wrap:wrap;align-items:center;gap:4px" id=rh></div><button id=rm style="margin-top:8px" onclick=rmore()>Show more</button>`;
function rhist(){const m=rx?100:10;$('#rh').innerHTML='<b style="margin-right:6px">Previous rolls:</b>'+(RH.length?RH.slice(0,m).map(t=>`<span class=rh style="background:${RC[t]}"></span>`).join(''):'<small>none yet</small>');$('#rm').textContent=rx?'Show less':'Show more';$('#rm').hidden=RH.length<=10}
function rmore(){rx=!rx;rhist()}
function rbuild(i){const k=$('#rk');k.innerHTML=i.tiles.map(t=>`<div class=rt style="background:${RC[t]}"></div>`).join('');k.style.transition='none';k.style.transform='translateX(0)';k.offsetWidth}
function rpos(i,el){const k=$('#rk'),x=i.idx*RW+RW/2-k.parentElement.offsetWidth/2+(i.j||0);k.style.transition=el>=0&&el<500?`transform ${(SPN-100-el)/1000}s cubic-bezier(.12,.6,.1,1)`:'none';k.style.transform=`translateX(${-x}px)`}
const rsum=()=>rb.r+rb.g+rb.b;
function rmineFrom(){const m=BT[MY.id];rb=m?{r:m.r,g:m.g,b:m.b}:{r:0,g:0,b:0}}
function rui(){['r','g','b'].forEach(c=>{const m=RM[c],a=rb[c],e=$('#b_'+c);e.innerHTML=`${RN[c]}<small>${m}× · win +${(m-1)*100}%</small><small>${a?'Your bet '+F(a):'Bet '+F(ra)}</small><small>win +${F((a||ra)*(m-1))}</small>`;e.disabled=rp!='bet'});$('#rc').disabled=rp!='bet'||!rsum();document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',+c.dataset.v==ra))}
function rset(n){ra=Math.max(0,n);$('#ri').value=ra||'';rui()}
function rmul(x){rset(Math.max(1,Math.floor(ra*x)))}function rmax(){rset(Math.floor(BAL))}
function rcust(){ra=Math.max(0,+$('#ri').value||0);rui()}
async function rplace(c){if(rp!='bet')return;if(!(ra>0))return say('Pick an amount','bad');if(ra>BAL)return say('Not enough money','bad');const a=ra;setBal(BAL-a);try{const r=await api('r/bet',{c,amt:a});rb[c]=Math.round((rb[c]+a)*100)/100;setBal(r.bal);rui();say('Bet '+F(a)+' on '+RN[c],'ok')}catch(e){setBal(BAL+a);say(e,'bad')}}
async function rclr(){if(rp!='bet')return;try{const r=await api('r/clear');rb={r:0,g:0,b:0};setBal(r.bal);rui();say('Bets cleared')}catch(e){say(e,'bad')}}
function rwho(){if(cur!='Roulette'||!$('#w_r'))return;['r','g','b'].forEach(c=>{const l=Object.entries(BT).filter(([k,v])=>v&&v[c]>0),t=l.reduce((a,[k,v])=>a+v[c],0);$('#w_'+c).innerHTML=l.slice(0,8).map(([k,v])=>`<span title="${esc(nm(k))} · ${F(v[c])}" onclick="openP('${sid(k)}')">${av(col(k),24)}</span>`).join('')+(l.length>8?`<small>+${l.length-8}</small>`:'')+(t?`<small style="width:100%;text-align:center">${l.length} bet${l.length>1?'s':''} · ${F(t)}</small>`:'')})}
function rtick(){const ph=(Date.now()+skew)%CYC;if(ph<BET){$('#rs').textContent='Betting closes in '+Math.ceil((BET-ph)/1000)+'s';$('#rbar').style.width=(BET-ph)/BET*100+'%';if(rp!='bet'){rp='bet';rui()}}else{if(rp!='spin'){rp='spin';rui()}$('#rbar').style.width='0';if(ph<BET+SPN)$('#rs').textContent='Rolling…'}}
function rinit(){BT={};(RL.b||[]).forEach(([k,r,g,b])=>BT[k]={r,g,b});rmineFrom();rx=0;rp='';
if(RL.spin){rbuild(RL.spin);rpos(RL.spin,(Date.now()+skew)%CYC-BET)}else{const d={tiles:[...Array(64)].map((_,i)=>i%2?'b':'r'),idx:48,j:0};rbuild(d);rpos(d,-1)}
rhist();clearInterval(rt);rt=setInterval(rtick,100);rui();rwho();rtick()}
I['Roulette']=rinit;
// ---- CHAT / PLAYERS / PROFILE
function chatR(){const c=$('#chat');if(!c)return;const nb=c.scrollHeight-c.scrollTop-c.clientHeight<40;c.innerHTML=CHT.length?CHT.map(m=>m.t=='tip'?`<div class="cm gold">💸 ${nl(m.u)} tipped ${nl(m.to)} <b>${F(+m.amt||0)}</b></div>`:m.t=='ann'?`<div class="cm gold">📣 ${esc(m.x||'')}</div>`:`<div class=cm>${nl(m.u)}: ${esc(m.x||'')}</div>`).join(''):'<p>No messages yet. Say hi!</p>';if(nb)c.scrollTop=c.scrollHeight}
function onl(){const l=Object.values(PL).filter(p=>p.on);$('#cn').textContent='· '+l.length+' online';$('#onl').innerHTML=l.slice(0,24).map(p=>`<span title="${esc(p.name)}" onclick="openP('${sid(p.id)}')">${av(p.color,24)}</span>`).join('')}
function pfr(){$('#pf').innerHTML=av(MY.color,32)+'<span>'+esc(MY.name)+'</span>'}
async function csend(){const i=$('#ci'),t=i.value.trim();if(!t)return;i.value='';try{await api('chat',{text:t})}catch(e){$('#cnote').textContent=e;setTimeout(()=>$('#cnote').textContent='',2500)}}
function ov(h){const o=$('#ov');o.innerHTML='<div class=md>'+h+'</div>';o.hidden=false}
function cls(){$('#ov').hidden=true}
$('#ov').onclick=e=>{if(e.target.id=='ov')cls()};
const rkv=()=>Math.floor(((MY.lost||0)-(MY.rbc||0))*15)/100;
function openP(id){const me=id==MY.id,p=me?MY:PL[id];if(!p)return toast('Profile not found');const pg=Object.entries(p.pg||{}).sort((a,b)=>b[1]-a[1])[0];tmpc=cl(p.color);
let h=`<div style="display:flex;gap:12px;align-items:center"><span id=pav>${av(tmpc,56)}</span><div><h2 style="margin:0">${esc(p.name||'Player')}</h2><small>${me?'This is you':p.on?'🟢 Online':'Offline'}</small></div></div><div class=stats><div><small>Games played</small><b>${+p.games||0}</b></div><div><small>Total wagered</small><b>${F(+p.wag||0)}</b></div><div><small>Biggest win</small><b>${F(+p.big||0)}</b></div><div><small>Most played</small><b>${pg?esc(pg[0]):'—'}</b></div></div>`;
if(me){const r=rkv();h+=`<h3 style="margin:14px 0 6px">💰 Rakeback</h3><p>Get 15% of your losses back. Total lost: ${F(MY.lost||0)}</p><div class=row><button class=go onclick=rake() ${r>=.01?'':'disabled'}>Claim ${F(r)}</button></div><h3 style="margin:14px 0 6px">Edit profile</h3><div class=row><input id=pn maxlength=16 value="${esc(MY.name)}" placeholder="Name (min 3 characters)" style="flex:1;min-width:0"></div><div class=row>${PC.map(x=>`<span class=sw style="background:${x}" onclick="pcol('${x}')"></span>`).join('')}<input type=color id=pcc value="${tmpc}" onchange="pcol(this.value)" style="width:42px;height:32px;padding:2px"></div><div id=pm class=bad></div><div class=row><button class=go onclick=psave()>Save</button><button onclick=cls()>Close</button></div>`}
else h+=`<h3 style="margin:14px 0 6px">💸 Send a tip</h3><p>Your balance: ${F(BAL)}</p><div class=row>${[100,1000,10000].map(x=>`<button onclick="tset(${x})">${F(x)}</button>`).join('')}<input id=ti type=number min=1 placeholder="Amount" style="width:110px"></div><div id=pm class=bad></div><div class=row><button class=go onclick="tip('${sid(id)}')">Send tip</button><button onclick=cls()>Close</button></div>`;
ov(h)}
const tset=x=>$('#ti').value=x;
function pcol(x){tmpc=cl(x);$('#pav').innerHTML=av(tmpc,56)}
async function psave(){const n=$('#pn').value.trim();if(n.length<3)return $('#pm').textContent='Name must be at least 3 characters';try{await api('profile',{name:n,color:tmpc});MY.name=n.slice(0,16);MY.color=tmpc;PL[MY.id]=Object.assign(PL[MY.id]||{},{name:MY.name,color:MY.color});pfr();chatR();onl();rwho();cls()}catch(e){$('#pm').textContent=e}}
async function tip(id){const a=Math.floor(+$('#ti').value*100)/100,pm=$('#pm');if(!(a>0))return pm.textContent='Enter an amount';if(a>BAL)return pm.textContent='Not enough money';try{const r=await api('tip',{to:id,amt:a});setBal(r.bal);toast('Tipped '+F(a)+' to '+nm(id),1);cls()}catch(e){pm.textContent=e}}
async function rake(){try{const r=await api('rake');setBal(r.bal);MY.rbc=MY.lost;toast('Rakeback claimed: '+F(r.got));cls()}catch(e){toast(e)}}
// ---- ADMIN (needs the ADMIN_KEY env var on the server)
function logo(){const n=Date.now();lk=n-lt<3000?lk+1:1;lt=n;if(lk>=5){lk=0;return adminLogin()}goHome()}
async function adminLogin(){if(AK)return openAdmin();const k=prompt('Admin key');if(!k)return;AK=k;try{await api('admin',{key:AK,op:'info'});try{sessionStorage.setItem('ak',AK)}catch(e){}$('#adm').hidden=false;openAdmin()}catch(e){AK='';toast('Wrong admin key')}}
async function adm(op,x){try{return await api('admin',Object.assign({key:AK,op},x||{}))}catch(e){if(e=='Wrong admin key'){AK='';$('#adm').hidden=true}$('#pm')&&($('#pm').textContent=e);return null}}
async function openAdmin(){const i=await adm('info');if(!i)return;const pl=Object.values(PL).filter(p=>p.id!=MY.id);
ov(`<h2>🛠 Admin panel</h2><div class=stats><div><small>House bank</small><b>${F(i.house)}</b></div><div><small>Players / online</small><b>${i.n} / ${i.on}</b></div></div><div class=row><button class=go onclick=awd()>Withdraw house to my balance</button></div>
<h3 style="margin:14px 0 6px">Give money</h3><div class=row><select id=ap style="flex:1;min-width:0">${pl.map(p=>`<option value="${sid(p.id)}">${esc(p.name)}</option>`).join('')||'<option value="">No other players</option>'}</select><input id=aa type=number min=1 placeholder="Amount" style="width:100px"></div><div class=row><button class=go onclick=agive()>Send money</button></div>
<h3 style="margin:14px 0 6px">📣 Gold announcement</h3><div class=row><input id=at maxlength=200 placeholder="Message to everyone" style="flex:1;min-width:0"><button class=go onclick=aann()>Post</button></div>
<div id=pm class=bad></div><div class=row><button onclick=aclear()>Clear chat</button><button onclick=cls()>Close</button></div>`)}
async function awd(){const r=await adm('withdraw');if(r){setBal(r.bal);toast('Withdrew '+F(r.got)+' from the house');cls()}}
async function agive(){const r=await adm('give',{to:$('#ap').value,amt:+$('#aa').value});if(r){toast('Sent');cls()}}
async function aann(){const r=await adm('ann',{text:$('#at').value});if(r)cls()}
async function aclear(){const r=await adm('clear');if(r){toast('Chat cleared');cls()}}
// ---- NAV
const names=Object.keys(V),TH={'Coin Flip':['🪙','#f7b733,#fc4a1a','HOT'],'Dice':['🎲','#43cea2,#185a9d',''],'Limbo':['🚀','#8e2de2,#4a00e0','NEW'],'Crash':['📈','#f85032,#c0392b',''],'Mines':['💣','#434343,#111','HOT'],'Slots':['🎰','#ff00cc,#333399',''],'Roulette':['🎡','#11998e,#38ef7d','LIVE'],'Blackjack':['🃏','#2193b0,#6dd5ed','']};
function shelf(){$('#shelf').innerHTML=names.map(n=>{const t=TH[n],pl=Object.values(PL).reduce((a,p)=>a+((p.pg||{})[n]||0),0);return `<div class=gc onclick="show('${n}')"><div class=th style="background:linear-gradient(135deg,${t[1]})">${t[2]?`<i>${t[2]}</i>`:''}${t[0]}</div><div class=gi><b>${n}</b><small><span>🎮 ${pl.toLocaleString()} plays</span></small></div></div>`}).join('')}
function cs(o){document.body.classList.toggle('co',!!o);$('#sb').classList.toggle('h',!o);if(o){const c=$('#chat');c.scrollTop=c.scrollHeight}}
function show(n){cur=n;cs(0);$('#bc').hidden=n=='Roulette';$('#home').hidden=true;$('#play').hidden=false;$('#game').innerHTML=V[n];if(I[n])I[n]();say('')}
function goHome(){if(busy())return say('Finish your round first','bad');clearInterval(rt);cur='';cr=mn=bj=null;if(innerWidth>=900)cs(1);$('#play').hidden=true;$('#home').hidden=false;scrollTo(0,0);shelf()}
// ---- CONNECT
function connect(){const es=new EventSource('/api/stream?t='+TOK),on=(n,f)=>es.addEventListener(n,e=>f(JSON.parse(e.data)));
on('init',d=>{skew=d.now-Date.now();MY=d.me;PL={};d.players.forEach(p=>PL[p.id]=p);CHT=d.chat;RH=d.rh;RL=d.rl;if(!sp)setBal(MY.bal);pfr();chatR();onl();shelf();$('#cnote').textContent='';if(cur=='Roulette')rinit()});
on('me',m=>{const k=MY.name;MY=m;if(!sp)setBal(m.bal);PL[m.id]=m});
on('player',d=>{PL[d.id]=Object.assign(PL[d.id]||{},d);if(d.id==MY.id)Object.assign(MY,{games:d.games,wag:d.wag,big:d.big,pg:d.pg});chatR();onl()});
on('on',d=>{if(PL[d.id])PL[d.id].on=d.on;onl()});
on('chat',m=>{CHT.push(m);if(CHT.length>60)CHT.shift();chatR();if(m.t=='tip')toast('💸 '+nm(m.u)+' tipped '+nm(m.to)+' '+F(+m.amt||0),1);if(m.t=='ann')toast('📣 '+m.x,1)});
on('clear',()=>{CHT=[];chatR()});
on('note',d=>toast(d.x,1));
on('rnew',d=>{RL={id:d.id,spin:null,b:[]};BT={};rb={r:0,g:0,b:0};if(cur=='Roulette'){rui();rwho()}});
on('rbets',d=>{RL.b=d.b;BT={};d.b.forEach(([k,r,g,b])=>BT[k]={r,g,b});rmineFrom();if(cur=='Roulette'){rui();rwho()}});
on('rspin',d=>{RL.spin=d;if(cur=='Roulette'){rbuild(d);rpos(d,0)}});
on('rres',d=>{RH.unshift(d.res);if(RH.length>100)RH.pop();if(cur=='Roulette'){const tot=rsum(),pay=rb[d.res]*RM[d.res];$('#rs').textContent='Landed on '+RN[d.res]+'!';say(tot?(pay>tot?'Won '+F(pay-tot):pay==tot?'Break even':'Lost '+F(tot-pay))+' · '+RN[d.res]:RN[d.res],tot&&pay>=tot?'ok':'bad');rhist()}rb={r:0,g:0,b:0};if(cur=='Roulette')rui();setTimeout(bailChk,100)});
es.onerror=()=>{$('#cnote').textContent='Reconnecting…'}}
async function boot(){try{const j=await api('join',{tok:TOK});TOK=j.tok;try{localStorage.setItem('tok',TOK)}catch(e){}if(j.bonus)setTimeout(()=>toast('🎁 Daily bonus: +$10,000!',1),800);if(AK)$('#adm').hidden=false;connect()}catch(e){$('#cnote').textContent='Cannot reach the server'}}
shelf();cs(innerWidth>=900);boot();
</script></body></html>

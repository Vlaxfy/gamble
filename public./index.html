const gi=(n,z)=>`<svg viewBox="0 0 100 100" width="${z}" height="${z}">${GI[n]||''}</svg>`;
const homeOn=()=>{const h=$('#home');return !!h&&h.hidden===false};
function homeR(){if(!$('#bn1'))return;const ri=rankOf(MY.wag),R0=RANKS[ri],nx=RANKS[ri+1],pct=nx?Math.min(100,((MY.wag||0)-R0[0])/(nx[0]-R0[0])*100):100,r=rkv();
$('#bn1').innerHTML=`<div class=bnh>${av(MY.color,56)}<div style="min-width:0"><span class="bnn ${MY.own?'ownn':''}">${esc(MY.name)}</span>${tagH(MY.tag)}<div class=bnb>${CI}${F(BAL)}</div></div><div class=bnart>${rkIcon(ri,56)}</div></div><div class=bnr><span class=rkb>${rkIcon(ri,20)}<b style="color:${R0[2]}">${R0[1]}</b></span>${nx?`<span class=rkb><b style="color:${nx[2]}">${nx[1]}</b>${rkIcon(ri+1,20)}</span>`:''}</div><div class=pbar><i style="width:${pct}%;background:linear-gradient(90deg,${R0[2]},${nx?nx[2]:R0[2]})"></i></div><div class=bns><span>${Math.floor(pct)}% to next rank</span><span>${nx?FC(nx[0]-(MY.wag||0))+' to go':'Max rank'}</span></div>`;
$('#bn2').innerHTML=`<div class=bnt>Rakeback</div><div class=bnb>${CI}${F(r)}</div><small>You get 15% of everything you lose back, any time.</small><small id=dcd></small><button class=go style="margin-top:auto" onclick=rake() ${r>=.01?'':'disabled'}>Claim rakeback</button>`;homeCd()}
const CI='<svg width="18" height="18" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#f5b800" stroke="#a86f00" stroke-width="2"/><text x="12" y="16.5" text-anchor="middle" font-size="12" font-weight="900" fill="#8a5a00" font-family="Arial">H</text></svg>';
function homeCd(){const n=new Date(),ms=Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),n.getUTCDate()+1)-n.getTime(),d=$('#dcd');if(d)d.textContent='Next free $10,000 in '+Math.floor(ms/36e5)+'h '+Math.floor(ms%36e5/6e4)+'m (resets at midnight UTC)'}
function shelf(){const q=(($('#gs')||{}).value||'').toLowerCase(),l=names.filter(n=>n.toLowerCase().includes(q));$('#gcount').textContent='· '+l.length;$('#shelf').innerHTML=l.map(n=>{const t=TH[n],pl=Object.values(PL).reduce((a,p)=>a+((p.pg||{})[n]||0),0);return `<div class=gt onclick="show('${n}')" style="--g:${t[1]}"><div class=gta>${gi(n,100)}</div>${t[2]?`<i class=gtb>${t[2]}</i>`:''}<div class=gtn>${n}</div><small class=gtp>${pl.toLocaleString()} plays</small></div>`}).join('')}
const GINFO={'Coin Flip':'Pick Heads or Tails. A win pays exactly 2x your bet. The server flips the coin, nobody can see the result in advance.','Dice':'Roll under or over your number. The payout is 100 divided by your win chance, so a 50% shot pays exactly 2x.','Limbo':'Pick a target multiplier. If the rocket reaches it you win your bet times the target. Your odds are 1 in the target.','Crash':'Cash out before the multiplier crashes. The crash can come at any moment, up to a 100x ceiling. The server counts the moment you clicked.','Mines':'Every safe tile raises your multiplier. Hit a mine and the bet is gone. Cash out whenever you like.','Slots':'Three of a kind pays 4x to 75x. Any pair returns half your bet.','Roulette':'Red and black pay 2x. Green is a 2% shot and pays 50x. Everyone shares the same wheel and a new spin starts every 20 seconds.','Blackjack':'Dealer stands on 17. Wins pay 2x, blackjack pays 3:2. You can double down, and split matching cards into two hands.'};
let warned=0;
function warnSave(){ov(`<h2 style="margin:0 0 6px">Save your account code</h2><p>Your account lives in this browser. If you clear your data or switch devices without your code, <b>you will lose your account, your money and your rank.</b></p><p>Copy your code now and keep it somewhere safe. You can also find it any time in your profile.</p><input readonly value="${esc(TOK)}" onclick="this.select()" style="width:100%"><div class=row><button class=go onclick=copyCode()>Copy code</button><button onclick="cls();openP(ME())">Open my profile</button><button onclick=cls()>I saved it</button></div>`,'wm')}
function copyCode(){const t=TOK;if(typeof navigator!='undefined'&&navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>toast('Code copied'),()=>toast('Press and hold the code to copy it'));else toast('Press and hold the code to copy it')}
function ddt(){$('#ddm').classList.toggle('open')}
function goTo(id){if($('#home').hidden)goHome();setTimeout(()=>{const e=$('#'+id);if(e&&e.scrollIntoView)e.scrollIntoView({behavior:'smooth'})},80)}
function cs(o){document.body.classList.toggle('co',!!o);$('#sb').classList.toggle('h',!o);if(o){const c=$('#chat');c.scrollTop=c.scrollHeight}}
function show(n){cur=n;cs(0);$('#bc').hidden=n=='Roulette';$('#home').hidden=true;$('#play').hidden=false;$('#game').className='card gm g-'+n.toLowerCase().replace(/\s+/g,'');$('#ginfo').innerHTML=GINFO[n]||'';$('#game').innerHTML=V[n].replace(/<h2>\S+ /,'<h2 class=gh2>'+gi(n,30)+' ');if(I[n])I[n]();say('');scrollTo(0,0)}
function goHome(){if(busy())return say('Finish your round first','bad');clearInterval(rt);cur='';cr=mn=bj=null;cs(1);$('#play').hidden=true;$('#home').hidden=false;scrollTo(0,0);shelf();homeR();lbLoad()}
// ---- CONNECT
function connect(){const es=new EventSource('/api/stream?t='+TOK),on=(n,f)=>es.addEventListener(n,e=>f(JSON.parse(e.data)));
on('init',d=>{skew=d.now-Date.now();MY=d.me;PL={};d.players.forEach(p=>PL[p.id]=p);CHT=d.chat;RH=d.rh;RL=d.rl;if(!sp)setBal(MY.bal);pfr();chatR();onl();shelf();admChk(MY);lbLoad();homeR();if(!warned){warned=1;setTimeout(warnSave,900)}$('#cnote').textContent='';if(cur=='Roulette')rinit()});
on('me',m=>{MY=m;if(homeOn())homeR();if(!sp)setBal(m.bal);PL[m.id]=m;pfr();admChk(m)});
on('player',d=>{PL[d.id]=Object.assign(PL[d.id]||{},d);if(d.id==MY.id){Object.assign(MY,{games:d.games,wag:d.wag,big:d.big,pg:d.pg,tag:d.tag,bio:d.bio,own:d.own});pfr();if(homeOn())homeR()}chatR();onl()});
on('on',d=>{if(PL[d.id])PL[d.id].on=d.on;onl()});
on('chat',m=>{CHT.push(m);if(CHT.length>60)CHT.shift();chatR();if(m.t=='tip')toast(nm(m.u)+' tipped '+nm(m.to)+' '+F(+m.amt||0),1);if(m.t=='ann')toast('Announcement: '+m.x,1)});
on('clear',()=>{CHT=[];chatR()});
on('note',d=>toast(d.x,1));
on('rnew',d=>{RL={id:d.id,spin:null,b:[]};BT={};rb={r:0,g:0,b:0};if(cur=='Roulette'){rui();rwho()}});
on('rbets',d=>{RL.b=d.b;BT={};d.b.forEach(([k,r,g,b])=>BT[k]={r,g,b});rmineFrom();if(cur=='Roulette'){rui();rwho()}});
on('rspin',d=>{RL.spin=d;if(cur=='Roulette'){rbuild(d);rpos(d,0)}});
on('rres',d=>{RH.unshift(d.res);if(RH.length>100)RH.pop();if(cur=='Roulette'){const tot=rsum(),pay=rb[d.res]*RM[d.res];$('#rs').textContent='Landed on '+RN[d.res]+'!';say(tot?(pay>tot?'Won '+F(pay-tot):pay==tot?'Break even':'Lost '+F(tot-pay))+' · '+RN[d.res]:RN[d.res],tot&&pay>=tot?'ok':'bad');rhist()}rb={r:0,g:0,b:0};if(cur=='Roulette')rui();setTimeout(bailChk,100)});
es.onerror=()=>{$('#cnote').textContent='Reconnecting…'}}
async function boot(){try{const j=await api('join',{tok:TOK});TOK=j.tok;try{localStorage.setItem('tok',TOK)}catch(e){}if(j.bonus)setTimeout(()=>toast('Daily bonus: +$10,000!',1),800);if(AK)$('#adm').hidden=false;connect()}catch(e){$('#cnote').textContent='Cannot reach the server'}}
$('#ddm').innerHTML=names.map(n=>`<a onclick="show('${n}');ddt()">${gi(n,26)}<span>${n}</span></a>`).join('');if(document.addEventListener)document.addEventListener('click',e=>{if(!(e.target&&e.target.closest&&e.target.closest('.dd')))$('#ddm').classList.remove('open')});
setInterval(()=>{if(homeOn())homeCd();if(MY.admUntil&&MY.admUntil<=Date.now()){MY.admUntil=0;admChk(MY)}},1000);
shelf();homeR();cs(1);boot();
</script></body></html>

const $=s=>document.querySelector(s),R=Math.random,F=n=>'$'+(Math.round(n*100)/100).toLocaleString(undefined,{maximumFractionDigits:2});
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),cl=c=>/^#[0-9a-f]{6}$/i.test(c)?c:'#888888',sid=k=>String(k).replace(/[^\w-]/g,'');
const av=(c,z=32)=>`<svg width=${z} height=${z} viewBox="0 0 32 32" style="border-radius:50%;background:${cl(c)};flex:none"><circle cx=16 cy=12 r=5.5 fill="#fff" opacity=".92"/><path d="M5 29c0-6 5-10 11-10s11 4 11 10z" fill="#fff" opacity=".92"/></svg>`;
const PC=['#e11d48','#f97316','#eab308','#22c55e','#06b6d4','#3b82f6','#8b5cf6','#ec4899','#14b8a6','#64748b'];
const RANKS=[[0,'Unranked','#7b8494'],[100,'Bronze','#cd7f32'],[1e4,'Silver','#c7d0dc'],[1e7,'Gold','#f7c948'],[5e7,'Experienced','#34d399'],[1.5e8,'Platinum','#4fe3e8'],[3e8,'Elite','#b061ff'],[1e12,'Champion','#ff3b6b']];
const GAMES=['Coin Flip','Dice','Limbo','Crash','Mines','Slots','Roulette','Blackjack'],GT=25,GC={'Coin Flip':'#d9a400','Dice':'#10b981','Limbo':'#8b5cf6','Crash':'#ef4444','Mines':'#64748b','Slots':'#ec4899','Roulette':'#14b8a6','Blackjack':'#2563eb'};
function rankOf(w){let r=0;RANKS.forEach((x,i)=>{if((w||0)>=x[0])r=i});return r}
function rkIcon(i,z=22){const c=RANKS[i][2];let g='';if(i>=1&&i<=3)for(let k=0;k<i;k++)g+=`<path d="M7 ${11+k*4.2}l5 3 5-3" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity=".95"/>`;else if(i==4)g='<path d="M12 8l1.8 3.7 4 .6-2.9 2.8.7 4L12 17.2 8.4 19.1l.7-4-2.9-2.8 4-.6z" fill="#fff" opacity=".95"/>';else if(i==5)g='<path d="M12 8l5.5 5.5L12 21 6.5 13.5z" fill="#fff" opacity=".95"/>';else if(i==6)g='<path d="M13 6l-5 8h3.5l-1.5 7 6-9h-3.8z" fill="#fff" opacity=".95"/>';else if(i==7)g='<path d="M6 20l-1-9 4 3.5L12 8l3 6.5 4-3.5-1 9z" fill="#fff" opacity=".97"/>';
return `<svg class=rki width=${z} height=${Math.round(z*1.17)} viewBox="0 0 24 28"><title>${RANKS[i][1]}</title><path d="M12 1l10 4v8c0 7-5 12-10 14C7 25 2 20 2 13V5z" fill="${c}" stroke="rgba(0,0,0,.55)" stroke-width="1.3"/><path d="M12 1l10 4v8c0 3-1 5.5-2.5 7.6C14 17 12 10 12 1z" fill="#fff" opacity=".18"/>${g}</svg>`}
function tagInfo(k){if(k=='OWNER')return['OWNER','#f7c948','#3b2a00'];if(k=='ADMIN')return['ADMIN','#ef4444','#fff'];if(k&&k.slice(0,2)=='g:'){const g=k.slice(2);return[g.toUpperCase()+'!',GC[g]||'#64748b','#fff']}return null}
const tagH=k=>{const t=tagInfo(k);return t?`<span class=tg style="background:${t[1]};color:${t[2]}">${esc(t[0])}</span>`:''};
let TOK=null,AK='',MY={id:'',name:'…',color:'#888888',bal:0,games:0,wag:0,big:0,pg:{},lost:0,rbc:0},BAL=0,PL={},CHT=[],RH=[],skew=0,cur='',sp=0,cr=null,mn=null,bj=null,rb={r:0,g:0,b:0},BT={},RL={id:0,spin:null,b:[]},rp='',rx=0,ra=100,rt=0,tmpc='',tt=0,lk=0,lt=0,cang=0;
try{TOK=localStorage.getItem('tok');AK=sessionStorage.getItem('ak')||''}catch(e){}
const V={},I={},ME=()=>MY.id,mine=k=>k==MY.id,PP=k=>mine(k)?MY:PL[k],nm=k=>(PP(k)&&PP(k).name)||'Player',col=k=>PP(k)&&PP(k).color,nl=k=>{const p=PP(k)||{};return `<a class=nl onclick="openP('${sid(k)}')">${av(p.color,20)}${rkIcon(rankOf(p.wag),15)}<b class="${p.own?'ownn':''}">${esc(p.name||'Player')}</b>${tagH(p.tag)}</a>`};
let inflight=0,lb=null;
async function api(path,body){inflight++;try{const r=await fetch('/api/'+path,{method:'POST',headers:{'content-type':'application/json','x-token':TOK||''},body:JSON.stringify(body||{})});let j;try{j=await r.json()}catch(e){j={err:'Network error'}}lb=typeof j.bal=='number'?j.bal:null;if(!r.ok)throw j.err||'Error';return j}finally{inflight--}}
const say=(m,c)=>{$('#msg').textContent=m;$('#msg').className=c||''};
function toast(t,g){const e=$('#toast');e.style.background=g?'linear-gradient(90deg,#f7c948,#ffe27a)':'#111';e.style.color=g?'#3b2a00':'#fff';e.textContent=t;e.style.opacity=1;clearTimeout(tt);tt=setTimeout(()=>e.style.opacity=0,3500)}
const busy=()=>cr||(mn&&mn.on)||(bj&&bj.on)||sp||rb.r+rb.g+rb.b>0;
const FC=n=>{const a=Math.abs(n);for(const[v,s]of[[1e12,'T'],[1e9,'B'],[1e6,'M'],[1e3,'K']])if(a>=v)return (n<0?'-':'')+'$'+(Math.round(Math.abs(n)/v*100)/100)+s;return F(n)};
function setBal(x){BAL=Math.round(x*100)/100;MY.bal=BAL;$('#bal').textContent=BAL>=1e9?FC(BAL):F(BAL);$('#bal').title=F(BAL);setTimeout(bailChk,500)}
function bailChk(){$('#bail').hidden=!(BAL<1&&!busy()&&TOK&&!inflight)}
async function bail(){try{const r=await api('bail');setBal(r.bal);toast('Here is $100 to get you going 🍀')}catch(e){toast(e)}}
function pa(s){s=String(s==null?'':s).trim().toLowerCase().replace(/[,\s_$]/g,'');const m=s.match(/^(\d*\.?\d+)(k|m|b|t)?$/);if(!m)return NaN;return Math.round(parseFloat(m[1])*({k:1e3,m:1e6,b:1e9,t:1e12}[m[2]]||1)*100)/100}
function pd(s){const m=String(s).trim().toLowerCase().match(/^(\d*\.?\d+)\s*(m|min|mins|h|hr|hrs|d|day|days)?$/);if(!m)return NaN;const u=m[2]||'m';return Math.round(parseFloat(m[1])*(u[0]=='d'?864e5:u[0]=='h'?36e5:6e4))}
function left(ms){const m=Math.ceil(ms/60000);return m>=1440?Math.floor(m/1440)+'d '+Math.floor(m%1440/60)+'h':m>=60?Math.floor(m/60)+'h '+m%60+'m':m+'m'}
function bet(){const b=pa($('#bet').value);if(!(b>0))return say('Enter a bet','bad'),0;if(b>BAL)return say('Not enough money','bad'),0;return b}
function bm(x){$('#bet').value=x?Math.max(1,Math.floor((pa($('#bet').value)||1)*x*100)/100):Math.min(BAL,1e15)}
async function go(path,body,b){setBal(BAL-b);try{return await api(path,body)}catch(e){setBal(lb!==null?lb:BAL+b);say(e,'bad');return null}}
function done(b,r,t){const p=r.pay||0;setBal(r.bal);say((t?t+' · ':'')+(p>b?'Won '+F(p-b):p==b?'Push':'Lost '+F(b-p)),p>=b?'ok':'bad')}
// ---- COIN
V['Coin Flip']=`<h2>🪙 Coin Flip</h2><p>Pick a side. Pays 1.96×. <b style="color:#d9a400">Heads = yellow</b>, <b style="color:#2563eb">Tails = blue</b></p><div class=stage><div class="cflip cf-h" id=cn>H</div><div class=sh id=sh></div></div><div class=row style="justify-content:center"><button class=go style="background:#d9a400;border-color:#b8860b" onclick="coin('Heads')">Heads</button><button class=go style="background:#2563eb;border-color:#1d4ed8" onclick="coin('Tails')">Tails</button></div>`;
let cside='Heads';
function cface(h){const e=$('#cn');e.className='cflip '+(h?'cf-h':'cf-t');e.textContent=h?'H':'T'}
async function coin(p){if(sp)return;const b=bet();if(!b)return;sp=1;const r=await go('coin',{side:p,amt:b},b);if(!r){sp=0;return}
const e=$('#cn'),sh=$('#sh'),t0=performance.now(),T=3400,a0=cside=='Tails'?180:0,a1=Math.ceil((a0+1800)/360)*360+(r.r=='Tails'?180:0);
(function f(now){const q=Math.min(1,(now-t0)/T),ease=1-Math.pow(1-q,3),th=(a0+(a1-a0)*ease)*Math.PI/180,c=Math.cos(th),s=Math.abs(Math.sin(th)),lift=Math.sin(Math.PI*Math.min(1,q*1.15))*90;
cface(c>=0);e.style.transform=`translateY(${-lift}px) scaleY(${Math.max(.05,Math.abs(c))})`;e.style.boxShadow=`0 ${(s*12).toFixed(1)}px 0 ${c>=0?'#8a6a00':'#1e3a8a'}`;sh.style.transform=`scale(${1-lift/200})`;
if(q<1)requestAnimationFrame(f);else{cside=r.r;cface(r.r=='Heads');e.style.transform='none';e.style.boxShadow='0 8px 0 '+(r.r=='Heads'?'#8a6a00':'#1e3a8a');sh.style.transform='none';sp=0;done(b,r,r.r)}})(performance.now())}
// ---- DICE
V['Dice']=`<h2>🎲 Dice</h2><p>Roll 0–100. Pick your odds. Lower chance = bigger payout.</p><div class=dnum id=o>🎲</div><div class=dbar id=dbar><i id=dm></i></div><div class=row><select id=dd onchange=du()><option value=u>Roll under</option><option value=o>Roll over</option></select><input id=dt type=range min=2 max=98 value=50 oninput=du() style="flex:1;min-width:120px"><b id=dl></b></div><div class=row style="justify-content:center"><button class=go onclick=dice()>🎲 Roll</button></div>`;
I['Dice']=()=>du();
function du(){const t=+$('#dt').value,u=$('#dd').value=='u',c=u?t:100-t;$('#dl').textContent=t+' → '+c+'% · '+(98/c).toFixed(2)+'×';$('#dbar').style.background=u?`linear-gradient(90deg,#22c55e ${t}%,#ef4444 ${t}%)`:`linear-gradient(90deg,#ef4444 ${t}%,#22c55e ${t}%)`}
async function dice(){if(sp)return;const b=bet();if(!b)return;sp=1;const r=await go('dice',{over:$('#dd').value=='o',t:+$('#dt').value,amt:b},b);sp=0;if(!r)return;$('#dm').style.left=r.roll+'%';$('#o').textContent=r.roll.toFixed(2);$('#o').className='dnum '+(r.pay>0?'win':'lose');done(b,r)}
// ---- LIMBO
V['Limbo']=`<h2>🚀 Limbo</h2><p>Set a target multiplier. Win if the rocket reaches it.</p><div class=lnum id=o>—</div><div class=row style="justify-content:center"><b>Target</b><input id=lt type=number value=2 min=1.01 step=0.01 style="width:90px"><button onclick="$('#lt').value=1.5">1.5×</button><button onclick="$('#lt').value=2">2×</button><button onclick="$('#lt').value=5">5×</button><button onclick="$('#lt').value=10">10×</button></div><div class=row style="justify-content:center"><button class=go onclick=limbo()>🚀 Launch</button></div>`;
async function limbo(){if(sp)return;const t=+$('#lt').value;if(!(t>=1.01))return say('Target must be ≥ 1.01','bad');const b=bet();if(!b)return;sp=1;const r=await go('limbo',{t,amt:b},b);sp=0;if(!r)return;$('#o').textContent=r.r.toFixed(2)+'×';$('#o').className='lnum '+(r.pay>0?'win':'lose');done(b,r)}
// ---- CRASH
V['Crash']=`<h2>📈 Crash</h2><p>The multiplier climbs until it crashes. Cash out in time!</p><div class=cwrap><svg viewBox="0 0 300 150" preserveAspectRatio="none"><polyline id=cl points="" fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg><div class=cnum id=o>1.00×</div></div><div class=row style="justify-content:center"><button class=go id=cb onclick=crash()>Start</button></div>`;
function cgraph(t,m,col){const T=Math.max(6,t),M=Math.max(2,m*1.15);cr.pts.push([t,m]);$('#cl').setAttribute('points',cr.pts.map(([a,b])=>(a/T*290+5).toFixed(1)+','+(145-(b-1)/(M-1)*135).toFixed(1)).join(' '));$('#cl').setAttribute('stroke',col||'#22c55e')}
async function crash(){if(cr){if(cr.q)return;cr.q=1;try{const r=await api('crash/cash'),a=cr.a;clearInterval(cr.i);cr=null;$('#cb').textContent='Start';if(r.crashed){$('#o').textContent='💥 '+r.cp.toFixed(2)+'×';done(a,r,'Crashed')}else{$('#o').textContent=r.m.toFixed(2)+'×';done(a,r,'Cashed out '+r.m.toFixed(2)+'×')}}catch(e){say(e,'bad');if(cr)cr.q=0}return}
const b=bet();if(!b)return;const r=await go('crash/start',{amt:b},b);if(!r)return;cr={a:b,t0:r.t0,q:0,pq:0,pts:[],i:setInterval(crTick,100)};$('#cl').setAttribute('points','');$('#cb').textContent='💰 Cash out'}
async function crTick(){if(!cr)return;const t=(Date.now()+skew-cr.t0)/1000,m=Math.exp(.12*t);$('#o').textContent=m.toFixed(2)+'×';cgraph(t,m);if(cr.pq||cr.q)return;cr.pq=1;try{const s=await api('crash/state');if(cr&&!s.on){clearInterval(cr.i);const a=cr.a;cr=null;$('#cb').textContent='Start';if(s.crashed){$('#o').textContent='💥 '+s.cp.toFixed(2)+'×';$('#cl').setAttribute('stroke','#ef4444');done(a,{bal:s.bal,pay:0},'Crashed')}}}catch(e){}if(cr)cr.pq=0}
// ---- MINES
V['Mines']=`<h2>💣 Mines</h2><p>Reveal gems, dodge mines. Cash out any time.</p><div class=row><select id=mc><option>1</option><option selected>3</option><option>5</option><option>10</option><option>15</option><option>24</option></select><small>mines</small><button class=go id=mb onclick=mines()>Start</button><b id=mm></b></div><div class=grid id=mg></div>`;
function mdraw(){$('#mg').innerHTML=[...Array(25)].map((_,i)=>`<button class="${mn&&mn.r.has(i)?'gem':mn&&mn.k&&mn.k.includes(i)?'bomb':''}" ${mn&&mn.on&&!mn.r.has(i)&&!mn.q?'':'disabled'} onclick=mpick(${i})>${mn&&mn.r.has(i)?'💎':mn&&mn.k&&mn.k.includes(i)?'💣':'?'}</button>`).join('')}
I['Mines']=()=>{mn=null;mdraw()};
async function mines(){if(mn&&mn.on){if(!mn.r.size||mn.q)return;mn.q=1;try{const r=await api('mines/cash');mn.on=0;mn.k=r.k;mdraw();$('#mb').textContent='Start';done(mn.a,r,r.x.toFixed(2)+'×')}catch(e){say(e,'bad');mn.q=0}return}
const b=bet();if(!b)return;const r=await go('mines/start',{amt:b,m:+$('#mc').value},b);if(!r)return;mn={on:1,a:b,r:new Set(),q:0,k:null};$('#mb').textContent='Cash out';$('#mm').textContent='1.00×';mdraw()}
async function mpick(i){if(!mn||!mn.on||mn.q)return;mn.q=1;try{const r=await api('mines/pick',{i});mn.q=0;if(r.boom){mn.on=0;mn.k=r.k;mdraw();$('#mb').textContent='Start';return done(mn.a,{bal:r.bal,pay:0},'💣 Boom')}
mn.r.add(i);$('#mm').textContent=r.x.toFixed(2)+'×';if(r.done){mn.on=0;mn.k=r.k;mdraw();$('#mb').textContent='Start';return done(mn.a,r,r.x.toFixed(2)+'×')}mdraw()}catch(e){mn.q=0;say(e,'bad')}}
// ---- SLOTS
const SY=['🍒','🍋','🔔','⭐','💎','7️⃣'];
V['Slots']=`<h2>🎰 Slots</h2><p>3 of a kind pays 4× to 75×. Any pair returns half.</p><div class=reels><div class=reel id=r0>🎰</div><div class=reel id=r1>🎰</div><div class=reel id=r2>🎰</div></div><div class=row style="justify-content:center"><button class=go onclick=slots()>🎰 Spin</button></div><div class=pay>🍒 4× · 🍋 6× · 🔔 10× · ⭐ 15× · 💎 30× · 7️⃣ 75× (three of a kind)</div>`;
async function slots(){if(sp)return;const b=bet();if(!b)return;sp=1;const r=await go('slots',{amt:b},b);if(!r){sp=0;return}let n=0;const stop=[10,16,22],i=setInterval(()=>{n++;for(let k=0;k<3;k++){const e=$('#r'+k);if(n<stop[k]){e.textContent=SY[Math.floor(R()*6)];e.classList.add('spin')}else{e.textContent=SY[r.r[k]];e.classList.remove('spin')}}if(n>=stop[2]){clearInterval(i);sp=0;done(b,r)}},70)}
// ---- BLACKJACK
V['Blackjack']=`<h2>🃏 Blackjack</h2><p>Dealer stands on 17. Blackjack pays 3:2. Double down, or split matching cards.</p><div class=felt id=bt><div class=bjl>Place your bet and press Deal</div></div><div class=row style="justify-content:center"><button class=go id=b0 onclick=bdeal()>Deal</button><button id=b1 onclick=bhit() disabled>Hit</button><button id=b2 onclick=bstand() disabled>Stand</button><button id=b3 onclick=bdbl() disabled>Double</button><button id=b4 onclick=bsplit() disabled>Split</button></div>`;
let bjc={d:0,h:[]};
const cardH=(c,nw,hide)=>{if(hide)return'<span class="pc bk"></span>';const rk=1+c%13,s='♠♥♦♣'[Math.floor(c/13)],l={1:'A',11:'J',12:'Q',13:'K'}[rk]||rk;return `<span class="pc${s=='♥'||s=='♦'?' r':''}${nw?' new':''}"><span>${l}</span><span class=s>${s}</span><span class=b>${l}</span></span>`};
function bdraw(r){const act=!r.done,hs=r.hands.map((h,k)=>`<div class="bjh${act&&k==r.i?' act':''}"><div class=bjl>${r.hands.length>1?'Hand '+(k+1)+' · ':''}You <b>${h.v}</b> · Bet ${F(h.a)}${h.st=='bust'?' · 💥 BUST':''}${r.done&&h.pay!=null?(h.pay>h.a?' · ✅ +'+F(h.pay-h.a):h.pay==h.a?' · 🤝 Push':' · ❌ −'+F(h.a)):''}</div><div class=bjr>${h.c.map((x,i)=>cardH(x,i>=(bjc.h[k]||0))).join('')}</div></div>`).join('');
$('#bt').innerHTML=`<div class=bjh><div class=bjl>Dealer ${r.done?'<b>'+r.dv+'</b>':''}</div><div class=bjr>${r.d.map((x,i)=>cardH(x,i>=bjc.d)).join('')}${act?cardH(0,false,true):''}</div></div>`+hs;
bjc={d:r.d.length,h:r.hands.map(h=>h.c.length)};const h=r.hands[r.i]||{c:[0,0],a:0};
$('#b0').disabled=act;$('#b1').disabled=$('#b2').disabled=!act;$('#b3').disabled=!act||h.c.length!=2||BAL<h.a;$('#b4').disabled=!act||r.hands.length!=1||h.c.length!=2||Math.min(10,1+h.c[0]%13)!=Math.min(10,1+h.c[1]%13)||BAL<h.a}
function bfin(r){bj.on=0;done(r.bet,r,r.msg)}
async function bdeal(){if(bj&&bj.on)return;const b=bet();if(!b)return;const r=await go('bj/deal',{amt:b},b);if(!r)return;bj={on:!r.done};bjc={d:0,h:[]};bdraw(r);say('');if(r.done)bfin(r)}
async function bact(p){if(!bj||!bj.on||bj.q)return;bj.q=1;try{const r=await api(p);bj.q=0;setBal(r.bal);bdraw(r);if(r.done)bfin(r)}catch(e){bj.q=0;say(e,'bad')}}
function bhit(){bact('bj/hit')}function bstand(){bact('bj/stand')}function bdbl(){bact('bj/double')}function bsplit(){bact('bj/split')}
// ---- ROULETTE
const RC={r:'#f50f14',b:'#000',g:'#27ae4f'},RN={r:'RED',g:'GREEN',b:'BLACK'},RM={r:2,g:50,b:2},RW=64,CYC=20000,BET=15000,SPN=4600,CHP=[[10,'10','#6b7280'],[100,'100','#2563eb'],[1000,'1K','#16a34a'],[10000,'10K','#9333ea'],[100000,'100K','#e11d48']];
const col3=(c,bg,fg)=>`<div class=col><button class=rb id=b_${c} style="background:${bg};${fg?'color:'+fg:''}" onclick="rplace('${c}')"></button><div class=who id=w_${c}></div></div>`;
V['Roulette']=`<h2>🎡 Roulette</h2><p>Everyone shares the same roll, every 20s: 15s to bet, then it spins. Green is super rare (2%).</p><div id=rs class=rstat></div><div class=bar><i id=rbar></i></div>
<div style="position:relative;margin:28px 0 16px"><div style="position:absolute;left:50%;top:-24px;transform:translateX(-50%);font-size:24px;z-index:2;line-height:1">▼</div><div style="overflow:hidden;border:2px solid #000;border-radius:6px"><div id=rk style="display:flex"></div></div></div>
<div class=row style="justify-content:center">${CHP.map(c=>`<button class=chip data-v=${c[0]} style="background:${c[2]}" onclick="rset(${c[0]})">${c[1]}</button>`).join('')}</div>
<div class=row style="justify-content:center"><b>$</b><input id=ri type=text inputmode=decimal value=100 style="width:100px" oninput=rcust()><button onclick=rmul(.5)>½</button><button onclick=rmul(2)>2×</button><button onclick=rmax()>Max</button></div>
<div class=row style="justify-content:center;align-items:flex-start">${col3('r','#f50f14')}${col3('g','#27ae4f')}${col3('b','#000','#fff')}</div>
<div class=row style="justify-content:center"><button id=rc onclick=rclr()>Clear my bets</button></div>
<div style="margin-top:12px;display:flex;flex-wrap:wrap;align-items:center;gap:4px" id=rh></div><button id=rm style="margin-top:8px" onclick=rmore()>Show more</button>`;
function rhist(){const m=rx?100:10;$('#rh').innerHTML='<b style="margin-right:6px">Previous rolls:</b>'+(RH.length?RH.slice(0,m).map(t=>`<span class=rh style="background:${RC[t]}"></span>`).join(''):'<small>none yet</small>');$('#rm').textContent=rx?'Show less':'Show more';$('#rm').hidden=RH.length<=10}

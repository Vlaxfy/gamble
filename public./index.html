<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:var(--org);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
button{font:inherit;cursor:pointer}[hidden]{display:none!important}

.logo{font:400 clamp(44px,9vw,96px)/.95 var(--fx);color:#fff;letter-spacing:1px;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink),0 10px 24px rgba(30,27,75,.35);transform:rotate(-4deg)}

#load .logo{position:relative;z-index:2}.lcrit{position:relative;z-index:2;width:110px;height:120px;animation:hop .9s ease-in-out infinite}
.lcrit b{position:absolute;inset:0;background:radial-gradient(circle at 35% 30%,#ff9ccc,var(--pink) 60%,#c2185b);border-radius:50% 50% 44% 44%/62% 62% 38% 38%;box-shadow:0 10px 0 rgba(30,27,75,.25)}
.lcrit i{position:absolute;top:18px;width:30px;height:30px;background:#fff;border-radius:50%;box-shadow:inset -8px -4px 0 #111827,inset -8px -4px 0 4px #111827}.lcrit i:first-of-type{left:24px}.lcrit i+i{left:56px}

.lbarw{position:relative;z-index:2;width:min(360px,80vw);height:22px;border-radius:999px;background:rgba(30,27,75,.25);border:3px solid var(--ink);overflow:hidden}#lbar{height:100%;width:8%;background:linear-gradient(90deg,var(--pink),var(--pink2));transition:width 1.2s ease}

.mtop .ml{font:400 22px var(--fx);letter-spacing:1px;color:#ffe14d;-webkit-text-stroke:1px var(--ink)}
.mnav{display:flex;gap:6px;flex:1;justify-content:center}.mnav button{border:0;border-radius:12px;padding:8px 14px;background:rgba(255,255,255,.12);color:#fff;font:400 15px var(--fx);letter-spacing:.5px}.mnav button.on{background:var(--pink);box-shadow:0 3px 0 #b0005f}

.season h4{margin:0 0 6px;font:400 18px var(--fx);display:flex;justify-content:space-between;align-items:center}.season h4 span{background:#7c3aed;color:#fff;border-radius:10px;padding:2px 10px;font-size:15px}
.bpbar{height:16px;border-radius:999px;background:#e9d5ff;overflow:hidden;border:2px solid var(--ink)}#bpf{height:100%;background:linear-gradient(90deg,#a855f7,#ec4899);width:0}

#menu[data-tab=play] #mpanel{display:none}#menu[data-tab=pass] #mpanel{left:2vw;right:2vw;width:auto;top:auto;height:300px}
#mpanel h2{margin:0 0 8px;font:400 26px var(--fx)}#mpanel h3{font:400 18px var(--fx);margin:16px 0 4px}.sub{margin:0 0 10px;color:#475569;font-weight:600;font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.chips button{border:3px solid var(--ink);background:#fff;border-radius:12px;padding:6px 12px;font:400 15px var(--fx)}.chips button.on{background:var(--yel)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}

.itc.r0{--rc:#94a3b8}.itc.r1{--rc:#38bdf8;background:#f0f9ff}.itc.r2{--rc:#c084fc;background:#faf5ff}.itc.r3{--rc:#fbbf24;background:linear-gradient(180deg,#fffbeb,#fef3c7)}
.itc.eq{box-shadow:0 0 0 4px var(--pink)}.itc.eq::after{content:"✓";position:absolute;top:4px;right:6px;background:var(--pink);color:#fff;border-radius:50%;width:20px;height:20px;font-size:13px;display:grid;place-items:center}.itc.try{box-shadow:0 0 0 4px #22c55e}
.itc b{font-size:13px;line-height:1.15}.itc small{font-size:11px;font-weight:800;color:var(--rc)}
.ii{display:grid;place-items:center;width:56px;height:56px;border-radius:14px;font-size:30px;font-style:normal;background:linear-gradient(135deg,var(--a,#e2e8f0),var(--b,#f8fafc));box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.buy,.own{margin-top:4px;border:2px solid var(--ink);border-radius:10px;padding:4px 10px;background:var(--yel);font:400 14px var(--fx)}.own{background:#e2e8f0}
.swg{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:10px}.swg button{aspect-ratio:1;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 2px #cbd5e1}.swg button.on{box-shadow:0 0 0 4px var(--ink)}

.tier.r1{--rc:#38bdf8}.tier.r2{--rc:#c084fc}.tier.r3{--rc:#fbbf24}.tier.got{opacity:1}.tier.next{opacity:1;box-shadow:0 0 0 4px var(--pink)}

#tvx{position:absolute;top:10px;right:12px;z-index:3;background:var(--pink);color:#fff;border:3px solid var(--ink);border-radius:12px;padding:7px 14px;font:400 15px var(--fx);box-shadow:0 3px 0 var(--ink)}
#tvban{position:absolute;top:11%;left:50%;transform:translateX(-50%);z-index:3;font:400 40px var(--fx);color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);opacity:0;transition:opacity .2s;pointer-events:none;text-align:center;white-space:nowrap}#tvban.on{opacity:1}#tvban.big{font-size:130px;color:#ffe14d;-webkit-text-stroke:6px var(--ink);animation:pop .35s}#tvban small{display:block;font-size:20px;margin-top:6px;-webkit-text-stroke:2px var(--ink)}

 .home .logo{left:0;right:0;text-align:center;top:108px;font-size:44px}.season{left:50%;transform:translateX(-50%);top:168px;width:min(300px,84vw);padding:8px 12px}.season h4{font-size:15px}.playw{left:0;right:0;align-items:center;bottom:3vh}.play{font-size:40px;padding:12px 40px}#live{text-align:center;max-width:92vw}

 #tvtop{font-size:12px;gap:6px;padding:6px 10px;max-width:calc(100% - 104px);flex-wrap:wrap}#tvx{padding:6px 10px}#tvban.big{font-size:90px}}

const shRng=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};

 p.innerHTML=`<h2>🛒 Item Shop</h2><p class=sub>New items in ${Math.floor(left/3600000)}h ${Math.floor(left%3600000/60000)}m · tap an item to try it on</p><div class=grid>${l.map(id=>{const it=CATI[id],own=inv.has(id);return itCard(it,own?'<button class=own disabled>Owned</button>':`<button class=buy onclick="event.stopPropagation();buy('${id}')">🪙 ${fmt(PRICE[it.r])}</button>`)}).join('')}</div>`;

<div class=stg><div><b>${MY.lvl}</b><small>Level</small></div><div><b>${fmt(MY.xp)}</b><small>Total XP</small></div><div><b>${fmt((MY.tv||{}).win)}</b><small>Crowns</small></div><div><b>${fmt(MY.rounds)}</b><small>Rounds</small></div><div><b>${MY.tier}</b><small>Pass tier</small></div><div><b>${(MY.inv||[]).length}</b><small>Items</small></div></div>

 const loop=n=>{if($('#menu').hidden)return;MBG=requestAnimationFrame(loop);const dt=Math.min(.05,(n-lt)/1000);lt=n;stageR(n/1000,dt)};cancelAnimationFrame(MBG);MBG=requestAnimationFrame(loop)}

const eye=[ox,1.7+oy,7.4],tg=[ox,.9+oy,0];glFrame(eye,tg,[1,1,1],w,h,t,500,narrow?.9:.78,600);
glDraw(GLX.cyl,mTRS(0,-.4,0,0,0,0,1.15,.8,1.15),hx('#ff4fa3'),{rim:.25,pat:1,col2:hx('#ff7ab8')});glDraw(GLX.cyl,mTRS(0,.01,0,0,0,0,1.05,.04,1.05),hx('#ffd1e8'));glDraw(GLX.tor,mTRS(0,.0,0,0,t*.3,0,1.15,.35,1.15),hx('#ffe14d'),{em:.3});

STW.t=(STW.t||0)+dt;if(STW.t>2.6){STW.t=0;STW.sqv=-1.4}wobUpd(STW,dt,0,false,0);
charDraw({x:0,y:.03,z:0,ry:STG.rot+Math.sin(t*.6)*.55,col:MY.color,eq,t,ph:t,walk:false,sq:STW.sq,lean:STW.lean,tilt:Math.sin(t*1.3)*.05})}
function stageInput(){const cv=$('#stage');cv.onpointerdown=e=>{STG.drag={x:e.clientX};cv.setPointerCapture(e.pointerId)};cv.onpointermove=e=>{if(!STG.drag)return;STG.rot+=(e.clientX-STG.drag.x)*.012;STG.drag.x=e.clientX};cv.onpointerup=cv.onpointercancel=()=>{STG.drag=null;STW.sqv=-1}}

function connect(){if(ES)ES.close();ES=new EventSource('/api/stream?t='+TOK);const on=(n,f)=>ES.addEventListener(n,e=>f(JSON.parse(e.data)));
on('me',d=>{MY=d;meR()});on('tvs',d=>tvState(d));on('tvp',d=>tvPos(d));on('tvk',d=>tvKnock(d));on('tvc',d=>{if(TVX.on)tvChatAdd(d)});on('tvkick',()=>{tvClose();toast('You were removed from the round by an admin')});
on('tvxp',d=>{MY=d.me;meR();if(TVX.on)tvXpShow(d);else rewardPop(d)})}

async function tvSend(v){if(v[0]=='/'){const a=v.slice(1).split(' '),w=(a.shift()||'').toLowerCase(),say=x=>tvChatAdd({sys:1,x});const ad=async(op,o)=>{try{const r=await api('admin',Object.assign({key:AK,op},o||{}));say('✅ '+r.nm)}catch(e){say('⚠️ '+e)}};
 if(w=='login'){AK=a.join(' ');try{sessionStorage.setItem('trv_ak',AK)}catch(e){}return ad('login')}if(!AK)return say('Unknown command');
 if(w=='ann')return ad('ann',{text:a.join(' ')});if(w=='kick')return ad('kick',{to:a.join(' ')});if(w=='mute'){const m=a.length>1&&/^\d+$/.test(a[a.length-1])?a.pop():10;return ad('mute',{to:a.join(' '),min:m})}if(w=='unmute')return ad('unmute',{to:a.join(' ')});if(w=='give'){const n=a.pop();return ad('give',{to:a.join(' '),n})}if(w=='xp'){const n=a.pop();return ad('xp',{to:a.join(' '),n})}if(w=='skip')return ad('skip');
 return say('Admin commands: /ann text, /kick name, /mute name 10, /unmute name, /give name 50, /xp name 1000, /skip')}
 try{await tvPost('tv/chat',{text:v})}catch(x){tvChatAdd({sys:1,x:String(x)})}}

 const wait=Math.max(0,1600-(Date.now()-t0));$('#lbar').style.width='100%';setTimeout(()=>{$('#load').classList.add('out');setTimeout(()=>$('#load').hidden=true,600);menuShow();meR();setInterval(()=>{if(!$('#menu').hidden&&TAB=='play')liveR()},5000)},wait)}
catch(e){$('#ltip').textContent='Cannot reach the server. Retrying…';setTimeout(boot,3000)}}

// ================= ENGINE: math, tiny WebGL renderer, geometry =================
const hx=h=>{h=String(h||'#38bdf8').replace('#','');if(h.length==3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return[(n>>16&255)/255,(n>>8&255)/255,(n&255)/255]};
const tvRng=shRng;
function mMul(a,b){const o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+r]*b[c*4+k];o[c*4+r]=s}return o}
// T * Ry * Rx * Rz * S
function mTRS(x,y,z,rx,ry,rz,sx,sy,sz){const cx=Math.cos(rx),snx=Math.sin(rx),cy=Math.cos(ry),sny=Math.sin(ry),cz=Math.cos(rz),snz=Math.sin(rz);
const A=[[cy,sny*snx,sny*cx],[0,cx,-snx],[-sny,cy*snx,cy*cx]],m=new Float32Array(16);
for(let i=0;i<3;i++){const r0=A[i][0]*cz+A[i][1]*snz,r1=-A[i][0]*snz+A[i][1]*cz,r2=A[i][2];m[i]=r0*sx;m[4+i]=r1*sy;m[8+i]=r2*sz}m[12]=x;m[13]=y;m[14]=z;m[15]=1;return m}
const mComp=(x,y,z,ry,rz,sx,sy,sz)=>mTRS(x,y,z,0,ry,rz,sx,sy,sz);
function mPersp(f,a,n,fa){const t=1/Math.tan(f/2),m=new Float32Array(16);m[0]=t/a;m[5]=t;m[10]=(fa+n)/(n-fa);m[11]=-1;m[14]=2*fa*n/(n-fa);return m}
function mLook(e,c){let z=[e[0]-c[0],e[1]-c[1],e[2]-c[2]],l=Math.hypot(...z);z=z.map(v=>v/l);let x=[z[2],0,-z[0]];l=Math.hypot(...x)||1;x=x.map(v=>v/l);const y=[z[1]*x[2]-z[2]*x[1],z[2]*x[0]-z[0]*x[2],z[0]*x[1]-z[1]*x[0]];const m=new Float32Array(16);
m[0]=x[0];m[4]=x[1];m[8]=x[2];m[12]=-(x[0]*e[0]+x[1]*e[1]+x[2]*e[2]);m[1]=y[0];m[5]=y[1];m[9]=y[2];m[13]=-(y[0]*e[0]+y[1]*e[1]+y[2]*e[2]);m[2]=z[0];m[6]=z[1];m[10]=z[2];m[14]=-(z[0]*e[0]+z[1]*e[1]+z[2]*e[2]);m[15]=1;return m}
const GLX={};
function glInit(cv){const gl=cv.getContext('webgl',{antialias:true,alpha:true,premultipliedAlpha:false});if(!gl)return null;
const vs=`attribute vec3 p;attribute vec3 n;uniform mat4 M,VP;uniform float wave,time,wob;varying vec3 vn;varying vec3 wp;varying vec3 op;
void main(){vec3 q=p;if(wob>0.){float k=clamp(q.y/1.45,0.,1.);float s=sin(time*7.+wob)*.035*k;q.x*=1.+s;q.z*=1.+s;q.y*=1.-s*.5;}op=q;vec4 w=M*vec4(q,1.);
if(wave>0.){float a=w.x*.15+time*1.3,b=w.z*.21+time*.9,c=(w.x+w.z)*.37+time*2.1;w.y+=sin(a)*.35+sin(b)*.3+sin(c)*.12;float dx=cos(a)*.0525+cos(c)*.0444,dz=cos(b)*.063+cos(c)*.0444;vn=normalize(vec3(-dx,1.,-dz));}else vn=normalize(mat3(M)*n);wp=w.xyz;gl_Position=VP*w;}`;
const fs=`precision mediump float;uniform vec3 col,col2,fogc,cam,ld,edge;uniform float a,fogn,fogf,wv,em,pat,rim;varying vec3 vn;varying vec3 wp;varying vec3 op;
float h3(vec3 c){return fract(sin(dot(c,vec3(12.9898,78.233,37.719)))*43758.5453);}

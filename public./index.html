<div class=as><h3>Players</h3><input id=pls placeholder="Search a player" oninput=plF() style="width:100%;margin-bottom:6px" autocomplete=off><div id=plist class=alog style="max-height:260px">Loading players…</div></div><div class=as><h3>Money tools</h3><div class=row><select id=ap style="flex:1;min-width:0"><option value="${sid(MY.id)}">Me (${esc(MY.name)})</option>${opts}<option value="all">ALL players</option></select><input id=aa type=text inputmode=decimal placeholder="Amount (1k, 5m, 1b, 1q…)" style="width:160px" autocomplete=off></div><div class=row><button class=go onclick=agive()>Give money</button><button class=dng onclick=aset()>Set / reset balance</button></div><div class=row><button onclick=arake()>Reset rakeback</button>${own?'<button onclick=acode()>Show login code</button>':''}</div><small>1k = 1,000 · 1m = 1 million · 1b = 1 billion · 1t = 1 trillion · 1q = 1 quadrillion · 1oc = 1 octillion. Set with a blank amount resets to $1,000. The player menu above applies to money, rakeback and login code.</small></div>
${adminExtra(own,mr)}<div class=as><h3>Gold announcement</h3><div class=row><input id=at maxlength=200 placeholder="Message to everyone" style="flex:1;min-width:0"><button class=go onclick=aann()>Post</button></div></div>
${own?`<div class=as><h3>Coin flip rig (troll)</h3><div class=row><select id=cp style="flex:1;min-width:0"><option value="any">Anyone's next flip</option>${opts}</select></div><div class=row><button style="background:#d9a400;color:#000" onclick="arigc('Heads')">Next flip: Heads</button><button style="background:#2563eb;color:#fff" onclick="arigc('Tails')">Next flip: Tails</button><button onclick="arigc('')">Clear</button></div><small>${i.rigc?'Rigged: '+i.rigc.side+' for '+esc(i.rigc.who)+'.':'No coin rig active.'}</small></div><div class=as><h3>Roulette rig (troll)</h3><div class=row><button style="background:#dc2626;color:#fff" onclick="arig('r')">Rig RED</button><button style="background:#16a34a;color:#fff" onclick="arig('g')">Rig GREEN</button><button style="background:#000;color:#fff" onclick="arig('b')">Rig BLACK</button><button onclick="arig('')">Clear</button></div><small>${i.rig?'The next spin is rigged to '+RN[i.rig]+'.':'No rig active. Roulette is fully random.'}</small></div>
<div class=as><h3>Temporary admins</h3><div class=row><select id=gp style="flex:1;min-width:0">${opts||'<option value="">No other players</option>'}</select><input id=gt type=text placeholder="5s, 30m, 2h, 1d" style="width:130px" autocomplete=off></div><div class=row><button onclick="$('#gt').value='5s'">5s</button><button onclick="$('#gt').value='30s'">30s</button><button onclick="$('#gt').value='15m'">15m</button><button onclick="$('#gt').value='1h'">1h</button><button onclick="$('#gt').value='1d'">1d</button><button class=go onclick=agrant()>Give admin</button></div>${i.admins.length?i.admins.map(x=>`<div class=row style="justify-content:space-between"><span>${esc(x.name)} · ${left(x.left)} left</span><button class=dng onclick="akick('${sid(x.id)}')">Revoke</button></div>`).join(''):'<small>Nobody has temporary admin right now.</small>'}</div>`:''}
<div class=as><h3>Command box</h3><div class=row><input id=cx placeholder="/revoke name" style="flex:1;min-width:0" onkeydown="if(event.key=='Enter')runCmd()"><button class=go onclick=runCmd()>Run</button></div><small>/revoke name · /grant name 5s · /give name 1k · /give all 1m · /set name 1000 · /reset name · /wipe name · /who name · /rakereset name|all · /code name · /rigcoin heads|tails [name] · /rig red · /unmute name · /ann text · /clear</small></div>
<div class=as><h3>Chat tools</h3><button class=dng onclick=aclear()>Clear chat</button></div>
${own?`<div class=as><h3>Admin log <small>(permanent, cannot be deleted)</small></h3><div class=alog>${lg.length?lg.map(e=>`<div><span>${new Date(e.t).toLocaleString()}</span> <b>${esc(e.n)}</b> <i>${esc(e.o)}</i> ${esc(e.d||'')}</div>`).join(''):'Nothing logged yet.'}</div></div>`:''}
<div id=pm class=bad></div><button class="wide ax" onclick=cls()>Close</button>`,'am');if(own)loadPlayers()}
function runCmd(){const v=$('#cx').value.trim();if(v){cmd(v[0]=='/'?v:'/'+v);$('#cx').value=''}}
async function arig(c){const r=await adm('rig',{color:c});if(r){toast(c?'Next spin rigged to '+RN[c]:'Rig cleared');openAdmin()}}
async function awd(){const r=await adm('withdraw');if(r){setBal(r.bal);toast('Withdrew '+F(r.got)+' from the house');openAdmin()}}
const apLabel=()=>{const s=$('#ap');return s&&s.options&&s.options[s.selectedIndex]?s.options[s.selectedIndex].text:'player'};
async function agive(){const a=pa($('#aa').value);if(!(a>0)){toast('Type an amount like 1000, 1k, 2.5m or 1oc');return}const lb=apLabel(),r=await adm('give',{to:$('#ap').value,amt:a});if(r){setBal(r.bal);toast('Gave '+F(a)+' to '+lb);cls()}}
async function arake(){const lb=apLabel(),all=$('#ap').value=='all';if(all&&!confirm('Reset rakeback for EVERY player?'))return;const r=await adm('rakereset',{to:$('#ap').value});if(r){toast('Rakeback reset for '+lb);cls()}}
async function acode(){if($('#ap').value=='all')return toast('Pick one player');const r=await adm('code',{to:$('#ap').value});if(r)showCodeFor(r.name,r.code)}
async function arigc(side){const r=await adm('rigcoin',{to:$('#cp').value,side});if(r){toast(side?'Next coin flip rigged to '+side:'Coin rig cleared');openAdmin()}}
function showCodeFor(name,code){ov('<h2 style="margin:0 0 8px">Login code</h2><p>Account: <b>'+esc(name)+'</b></p><input readonly value="'+esc(code)+'" onclick="this.select()" style="width:100%"><p style="font-size:12px;color:var(--mu)">This code logs into their account. Only give it to the real owner.</p><div class=row><button class=go onclick="navigator.clipboard&&navigator.clipboard.writeText(\''+esc(code)+'\');toast(\'Copied\')">Copy</button><button onclick=cls()>Close</button></div>')}
async function aset(){const raw=$('#aa').value.trim(),v=raw===''?'':pa(raw),all=$('#ap').value=='all';if(raw!==''&&!(v>=0)){toast('Type an amount like 1000, 1k or 2.5m');return}const lb=apLabel();if(all&&!confirm('Set EVERY player\'s balance to '+(v===''?'$1,000':F(v))+'?'))return;const r=await adm('set',{to:$('#ap').value,amt:v});if(r){setBal(r.bal);toast(lb+' balance set to '+(v===''?'$1,000':F(v)));cls()}}
async function aann(){const r=await adm('ann',{text:$('#at').value});if(r)cls()}
async function aclear(){const r=await adm('clear');if(r){toast('Chat cleared');cls()}}
async function agrant(){const ms=pd($('#gt').value);if(!(ms>=1000)){$('#pm').textContent='Type a time like 5s, 30m, 2h or 1d';return}const r=await adm('grant',{to:$('#gp').value,ms});if(r){toast('Admin given');openAdmin()}}
async function akick(id){const r=await adm('kick',{to:id});if(r){toast('Admin removed');openAdmin()}}
function adminTools(id){return `<h3 style="margin:14px 0 6px">Admin tools</h3><div class=as2><div class=row><input id=ab type=text inputmode=decimal placeholder="New balance (0, 1k, 5m…)" style="width:180px" autocomplete=off><button class=go onclick="apSet('${sid(id)}')">Set balance</button></div><div class=row><button onclick="apDo('${sid(id)}','set')">Reset to $1,000</button><button class=dng onclick="apDo('${sid(id)}','wipe')">Wipe account</button><button onclick="apDo('${sid(id)}','rakereset')">Reset rakeback</button><button onclick="apDo('${sid(id)}','code')">Show login code</button></div><small>Wipe also clears games, wagered, biggest win and rank. Resetting also ends any game this player is in the middle of.</small></div>`}
const pn=id=>(PL[id]&&PL[id].name)||'Player';
async function apSet(id){const v=pa($('#ab').value);if(!(v>=0)){toast('Type an amount like 0, 1000, 1k or 2.5m');return}const r=await adm('set',{to:id,amt:v});if(r){toast(pn(id)+' is now at '+F(r.tb));lbLoad()}}
async function apDo(id,op){if(op=='wipe'&&!confirm('Wipe this account? Balance back to $1,000 and games, wagered, wins and rank cleared.'))return;const r=await adm(op,op=='set'?{to:id,amt:''}:{to:id});if(!r)return;if(op=='code')return showCodeFor(r.name,r.code);toast(pn(id)+(op=='set'?' reset to $1,000':op=='wipe'?' wiped':' rakeback reset')+(r.tb!=null?' · now '+F(r.tb):''));lbLoad()}
let PLX=[];
async function loadPlayers(){const r=await adm('players');if(!r)return;PLX=r.list;plF()}
function plF(){const q=(($('#pls')||{}).value||'').toLowerCase(),el=$('#plist');if(!el)return;el.innerHTML=PLX.filter(x=>(x.name||'').toLowerCase().includes(q)).slice(0,60).map(x=>`<div class=prow2><span>${x.on?I_DOT:''}<b>${esc(x.name)}</b></span><span title="${F(x.bal)}">${FC(x.bal)}</span><span class=pbtn><button onclick="plSet('${sid(x.id)}')">Set</button><button onclick="plReset('${sid(x.id)}')">Reset</button><button class=dng onclick="plWipe('${sid(x.id)}')">Wipe</button></span></div>`).join('')||'<div>No players match.</div>'}
async function plSet(id){const x=PLX.find(p=>p.id==id)||{name:'player'},v=pa(prompt('New balance for '+x.name+' (0, 1000, 1k, 5m…)'));if(!(v>=0))return;const r=await adm('set',{to:id,amt:v});if(r){toast(x.name+' is now at '+F(r.tb));await loadPlayers();lbLoad()}}
async function plReset(id){const x=PLX.find(p=>p.id==id)||{name:'player'},r=await adm('set',{to:id,amt:''});if(r){toast(x.name+' reset to $1,000');await loadPlayers();lbLoad()}}
async function plWipe(id){const x=PLX.find(p=>p.id==id)||{name:'player'};if(!confirm('Wipe '+x.name+'? Balance back to $1,000 and all stats cleared.'))return;const r=await adm('wipe',{to:id});if(r){toast(x.name+' wiped');await loadPlayers();lbLoad()}}
function findP(s){s=(s||'').toLowerCase().trim();if(!s){toast('Type a player name');return null}const L=Object.values(PL),f=fn=>L.filter(p=>fn((p.name||'').toLowerCase()));let m=f(n=>n==s);if(!m.length)m=f(n=>n.startsWith(s));if(!m.length)m=f(n=>n.includes(s));if(m.length==1)return m[0];toast(m.length>1?'Several players match "'+s+'", type more of the name':'No player named "'+s+'"');return null}
function splitP(t){for(let i=Math.min(t.length,4);i>=1;i--){const n=t.slice(0,i).join(' ').toLowerCase(),m=Object.values(PL).filter(p=>(p.name||'').toLowerCase()==n);if(m.length==1)return{p:m[0],rest:t.slice(i)}}const p=findP(t[0]);return p?{p,rest:t.slice(1)}:null}
async function cmd(t){const[w,...a]=t.slice(1).trim().split(/\s+/);let r,p,s;
switch((w||'').toLowerCase()){
case'revoke':case'kick':{p=findP(a.join(' '));if(!p)return;r=await adm('kick',{to:p.id});if(r)toast('Admin revoked from '+p.name);break}
case'grant':case'admin':{const tm=a.pop(),ms=pd(tm);p=findP(a.join(' '));if(!p)return;if(!(ms>=1000))return toast('Use: /grant name 5s');r=await adm('grant',{to:p.id,ms});if(r)toast('Admin given to '+p.name+' for '+left(ms));break}
case'give':{const am=pa(a.pop()),who=a.join(' ');p=who.toLowerCase()=='all'?{id:'all',name:'everyone'}:findP(who);if(!p)return;if(!(am>0))return toast('Use: /give name 1k');r=await adm('give',{to:p.id,amt:am});if(r){setBal(r.bal);toast('Gave '+F(am)+' to '+p.name)}break}
case'set':{const am=pa(a.pop()),who=a.join(' ');p=who.toLowerCase()=='all'?{id:'all',name:'everyone'}:findP(who);if(!p)return;if(!(am>=0))return toast('Use: /set name 1000');r=await adm('set',{to:p.id,amt:am});if(r){setBal(r.bal);toast(p.name+' balance set to '+F(am)+(r.tb!=null?' (confirmed: '+F(r.tb)+')':''));lbLoad()}break}
case'reset':{const who=a.join(' ');p=who.toLowerCase()=='all'?{id:'all',name:'everyone'}:findP(who);if(!p)return;r=await adm('set',{to:p.id,amt:''});if(r){setBal(r.bal);toast(p.name+' balance reset to $1,000'+(r.tb!=null?' (confirmed: '+F(r.tb)+')':''));lbLoad()}break}
case'wipe':{const who=a.join(' ');p=who.toLowerCase()=='all'?{id:'all',name:'everyone'}:findP(who);if(!p)return;if(p.id=='all'&&!confirm('Wipe EVERY account?'))return;r=await adm('wipe',{to:p.id});if(r){toast(p.name+' wiped'+(r.tb!=null?' · now '+F(r.tb):''));lbLoad()}break}
case'who':{p=findP(a.join(' '));if(!p)return;r=await adm('players');if(r){const x=r.list.find(y=>y.id==p.id);toast(x?x.name+': '+F(x.bal)+' · wagered '+FC(x.wag)+' · '+x.games+' games'+(x.on?' · online':''):'Not found')}break}
case'rakereset':case'rakeback':{const who=a.join(' ');p=who.toLowerCase()=='all'?{id:'all',name:'everyone'}:findP(who);if(!p)return;r=await adm('rakereset',{to:p.id});if(r)toast('Rakeback reset for '+p.name);break}
case'code':{p=findP(a.join(' '));if(!p)return;r=await adm('code',{to:p.id});if(r)showCodeFor(r.name,r.code);break}
case'rigcoin':{const sd={heads:'Heads',tails:'Tails',clear:'',off:''}[(a[0]||'').toLowerCase()];if(sd===undefined)return toast('Use: /rigcoin heads|tails [name]');const who=a.slice(1).join(' ');p=who?findP(who):{id:'any',name:'anyone'};if(!p)return;r=await adm('rigcoin',{to:p.id,side:sd});if(r)toast(sd?'Next flip rigged to '+sd+' for '+p.name:'Coin rig cleared');break}
case'rig':{const k={red:'r',black:'b',green:'g',clear:'',off:''}[(a[0]||'').toLowerCase()];if(k===undefined)return toast('Use: /rig red|black|green|clear');r=await adm('rig',{color:k});if(r)toast(k?'Next spin rigged':'Rig cleared');break}
case'mute':{s=splitP(a);if(!s)return;const ms=pd(s.rest[0]);if(!(ms>=1000))return toast('Use: /mute name 10m reason');r=await mapi('mod/mute',{to:s.p.id,ms,reason:s.rest.slice(1).join(' ')});if(r)toast('Muted '+s.p.name+' for '+left(ms));break}
case'unmute':{p=findP(a.join(' '));if(!p)return;r=await mapi('mod/unmute',{to:p.id});if(r)toast('Unmuted '+p.name);break}
case'warn':{s=splitP(a);if(!s)return;const x=s.rest.join(' ');if(!x)return toast('Use: /warn name message');r=await mapi('mod/warn',{to:s.p.id,text:x});if(r)toast('Warned '+s.p.name);break}
case'rename':{s=splitP(a);if(!s)return;const x=s.rest.join(' ');if(x.length<3)return toast('Use: /rename name NewName');r=await mapi('mod/rename',{to:s.p.id,name:x});if(r)toast('Renamed '+s.p.name+' to '+x);break}
case'ban':case'disable':{s=splitP(a);if(!s)return;const ms=pd(s.rest[0]);if(!(ms>=60000))return toast('Use: /ban name 1d reason');r=await mapi('mod/ban',{to:s.p.id,ms,reason:s.rest.slice(1).join(' ')});if(r)toast('Disabled '+s.p.name+' for '+left(ms));break}
case'unban':case'enable':{p=findP(a.join(' '));if(!p)return;r=await mapi('mod/unban',{to:p.id});if(r)toast('Enabled '+p.name);break}
case'mod':case'unmod':{p=findP(a.join(' '));if(!p)return;r=await adm('modset',{to:p.id,on:(w||'').toLowerCase()=='mod'});if(r)toast(p.name+((w||'').toLowerCase()=='mod'?' is now a moderator':' is no longer a moderator'));break}
case'mods':{r=await mapi('mod/list',{});if(r)toast('Moderators: '+((r.mods||[]).map(m=>m.name).join(', ')||'none'));break}
case'maketag':{let col=null;if(/^#[0-9a-f]{6}$/i.test(a[a.length-1]||''))col=a.pop();r=await adm('maketag',{name:a.join(' '),color:col});if(r)toast('Tag created: '+r.nm);break}
case'deltag':{const id=tagByName(a.join(' '));if(!id||id=='ADMIN'||id=='COOWNER')return toast('No custom tag with that name');r=await adm('deltag',{id});if(r)toast('Tag deleted');break}
case'granttag':case'revoketag':{s=splitP(a);if(!s)return;const id=tagByName(s.rest.join(' '));if(!id)return toast('No tag with that name. Use /tags to see them');r=await adm((w||'').toLowerCase()=='granttag'?'granttag':'revoketag',{to:s.p.id,tag:id});if(r)toast(((w||'').toLowerCase()=='granttag'?'Granted ':'Revoked ')+r.nm+' · '+s.p.name);break}
case'tags':{toast('Tags: CO-OWNER, ADMIN'+Object.values(CT).map(t=>', '+t.t).join(''));break}
case'stat':{s=splitP(a);if(!s)return;const v=pa(s.rest[1]);if(!s.rest[0]||!(v>=0))return toast('Use: /stat name streak|games|wagered|bigwin|lost|best value');r=await adm('stat',{to:s.p.id,field:s.rest[0],val:v});if(r){toast('Stat updated for '+s.p.name);lbLoad()}break}
case'annt':{const ms=pd(a[0]),x=a.slice(1).join(' ');if(!(ms>=5000)||!x)return toast('Use: /annt 10m message');r=await adm('banner',{text:x,ms});if(r)toast('Banner is live');break}
case'anndown':{r=await adm('bannerclear');if(r)toast('Banner taken down');break}
case'ann':{r=await adm('ann',{text:a.join(' ')});break}
case'appeals':{modPanel();break}
case'lock':case'unlock':{const g=names.find(n=>n.toLowerCase()==a.join(' ').toLowerCase());if(!g)return toast('Use: /'+w+' '+'Game name (like Plinko or Coin Flip)');r=await adm('lock',{game:g,on:w.toLowerCase()=='lock'});if(r)toast(r.nm);return}
case'updates':{const v=(a[0]||'').toLowerCase();if(v!='on'&&v!='off')return toast('Use: /updates on  or  /updates off');r=await adm('updates',{on:v=='on'});if(r)toast('Update ribbon '+r.nm);return}
case'mail':{const bar=a.join(' ').split('|').map(x=>x.trim());if(bar.length<3)return toast('Use: /mail all | Title | Message  (or /mail PlayerName | Title | Message)');const to=bar[0].toLowerCase()=='all'?{id:'all'}:findP(bar[0]);if(!to)return;r=await adm('mail',{to:to.id,title:bar[1],body:bar.slice(2).join(' | ')});if(r)toast('Mail sent to '+r.n+' player'+(r.n==1?'':'s'));break}
case'disband':{const q=await capi('clan/list');const cn=q&&q.list.find(x=>x.name.toLowerCase()==a.join(' ').toLowerCase());if(!cn)return toast('No clan with that name');r=await adm('clandel',{id:cn.id});if(r)toast('Clan disbanded: '+r.nm);break}
case'pollend':{const p0=POLLS.find(x=>x.q.toLowerCase().includes(a.join(' ').toLowerCase())&&x.end>Date.now()+skew);if(!p0)return toast('No running poll matches that');r=await adm('pollend',{id:p0.id});if(r)toast('Poll ended');break}
case'clear':{r=await adm('clear');if(r)toast('Chat cleared');break}
default:toast('Mod: /mute /unmute /warn /rename /ban /unban /appeals · Admin: /set /reset /wipe /who /stat /code /give /grant /revoke /mod /unmod /mods /maketag /deltag /granttag /revoketag /tags /annt /anndown /ann /mail /disband /pollend /rig /rigcoin /clear')}}
// ---- BANNER / WARN / MUTE / DISABLED
let BNR=null,BAN=null,bti=0,wt=0,ESr=null,MODCTX='mod';
function bannerR(){const b=$('#abn');if(!b)return;if(!BNR||BNR.until<=Date.now()+skew){b.hidden=true;return}b.hidden=false;b.innerHTML='<b>ANNOUNCEMENT</b> '+esc(BNR.text)+' <small>'+left(BNR.until-(Date.now()+skew))+' left</small>'}
function warnShow(d){const w=$('#wrn');w.hidden=false;w.innerHTML=`<div class=wh>WARNING</div><div>You have been warned by the ${esc(d.role)} <b>${esc(d.by)}</b>:</div><div class=wtx>${esc(d.text)}</div><div class=wbar><i></i></div>`;clearTimeout(wt);wt=setTimeout(()=>{w.hidden=true},15000)}
function muteR(){const b=$('#mbar');if(!b)return;const m=MY.mute;if(!m||m.until<=Date.now()+skew){b.hidden=true;return}b.hidden=false;b.innerHTML='Muted · '+left(m.until-(Date.now()+skew))+' left'+(m.why?' · '+esc(m.why):'')+(MY.appM?' · appeal sent':' <a onclick="appealOpen()">Appeal</a>')}
function appealOpen(){ov(`<h2 style="margin:0 0 6px">Appeal your mute</h2><p>Explain why the mute should be removed. A staff member will review it.</p><textarea id=apt rows=4 maxlength=300 placeholder="Write your appeal…"></textarea><div id=pm class=bad></div><div class=row><button class=go onclick=appealSend()>Send appeal</button><button onclick=cls()>Cancel</button></div>`)}
async function appealSend(){const t=($('#apt').value||'').trim();if(t.length<5){$('#pm').textContent='Please explain in a few words';return}try{await api('appeal/send',{type:'mute',text:t});MY.appM=true;muteR();cls();toast('Appeal sent. Staff will review it.')}catch(e){$('#pm').textContent=String(e)}}
function showBan(b){BAN=b;try{if(ESr)ESr.close()}catch(e){}const el=$('#dis');el.hidden=false;banR(true);clearInterval(bti);bti=setInterval(()=>{banR(false);if(BAN.until<=Date.now()+skew||Date.now()%15000<1000)pollBan()},1000)}
function banR(full){const b=BAN,el=$('#dis');if(!b||!el)return;const ms=b.until-(Date.now()+skew);if(!full){const t=$('#dtm');if(t)t.textContent=ms>0?left(ms):'re-enabling…';return}
const who=b.role=='Moderator'?'a moderator':'an admin';el.innerHTML=`<div class=disc><h1>Account temporarily disabled</h1><p>Your account has temporarily been disabled by ${who}${b.by?' (<b>'+esc(b.by)+'</b>)':''}.</p><p><b>Reason:</b> ${esc(b.reason||'Rule violation')}</p><p>Time remaining: <b id=dtm>${ms>0?left(ms):'re-enabling…'}</b></p>${b.rejected?'<p class=bad>Your appeal was reviewed and rejected. You must wait until your account is enabled again.</p>':b.appealed?'<p class=okk>Your appeal was sent. Staff will review it.</p>':`<h3>Appeal this decision</h3><textarea id=bat rows=4 maxlength=300 placeholder="Explain why your account should be re-enabled…"></textarea><div id=bpm class=bad></div><button class=go onclick=banAppeal()>Send appeal</button>`}</div>`}

let PLT=null,PK={balls:[],rows:12,risk:'med',raf:0,fl:{},hist:[],auto:0};
V['Plinko']=`<h2>🎯 Plinko</h2><p>Drop a ball and watch it bounce down into a multiplier. Higher risk means bigger edges and smaller middles.</p><div class=row><label>Risk <select id=pkr onchange=pkset()><option value=low>Low</option><option value=med selected>Medium</option><option value=high>High</option></select></label><label>Rows <select id=pkn onchange=pkset()>${[8,9,10,11,12,13,14,15,16].map(n=>`<option ${n==12?'selected':''}>${n}</option>`).join('')}</select></label><button class=go onclick=pkdrop()>Drop ball</button><label class=chk><input type=checkbox id=pka onchange=pkauto()> Auto drop</label></div><canvas id=pk width=720 height=600 class=pkc></canvas><div id=pkh class=pkh></div>`;
I['Plinko']=async()=>{PK.balls=[];PK.hist=[];PK.fl={};clearInterval(PK.auto);if(!PLT){const r=await capi('plinko/tbl');if(r)PLT=r.t}pkset(true);pkhr()};
function pkset(f){if(PK.balls.length&&!f){$('#pkr').value=PK.risk;$('#pkn').value=PK.rows;return toast('Wait for your balls to land first')}PK.risk=$('#pkr').value;PK.rows=+$('#pkn').value;if(!PK.raf)PK.raf=raf(pkloop)}
function pkauto(){clearInterval(PK.auto);if($('#pka')&&$('#pka').checked)PK.auto=setInterval(()=>{if(cur!='Plinko'){clearInterval(PK.auto);return}if(PK.balls.length<6)pkdrop()},650)}
function pkd(rows){const n=rows||PK.rows,W=720,H=600,sp=Math.min(60,(W-40)/(n+1)),top=50,bin=36;return{n,W,H,sp,top,bin,cx:W/2,dy:(H-top-bin-40)/(n-.2)}}
const pkcol=m=>m>=100?'#ef4444':m>=20?'#f97316':m>=5?'#f59e0b':m>=2?'#84cc16':m>=1?'#38bdf8':'#64748b';
function pkball(b,now){const d=b.d,p=(now-b.t0)/b.step-1,n=d.n,r=Math.max(5,d.sp*.21);if(p>=n)return null;const S=i=>i<0?[d.cx,16]:i>=n?[d.cx+(b.k-n/2)*d.sp,d.H-d.bin-6-r]:[d.cx+b.o[i]*d.sp/2,d.top+i*d.dy-r-4],i=Math.floor(p),f=p-i,a=S(i),c=S(i+1),y=a[1]+(c[1]-a[1])*(.3*f+.7*f*f)-(i>=0?Math.sin(Math.PI*f)*d.dy*.28:0);return[a[0]+(c[0]-a[0])*(f*(2-f)),y,r]}
function pkloop(){PK.raf=0;const cv=$('#pk');if(!cv||!cv.getContext||cur!='Plinko')return;const x=cv.getContext('2d');if(!x)return;const now=Date.now(),d=pkd();x.clearRect(0,0,d.W,d.H);
for(let i=0;i<d.n;i++){const c=i+3;for(let j=0;j<c;j++){const px=d.cx+(j-(c-1)/2)*d.sp,py=d.top+i*d.dy;x.fillStyle='rgba(125,211,252,.18)';x.beginPath();x.arc(px,py,7,0,7);x.fill();x.fillStyle='#e2e8f0';x.beginPath();x.arc(px,py,3.4,0,7);x.fill()}}
const tb=PLT&&PLT[d.n]&&PLT[d.n][PK.risk];for(let k=0;k<=d.n;k++){const bx=d.cx+(k-d.n/2)*d.sp,m=tb?tb[k]:0,by=d.H-d.bin-6,w=d.sp-4,hot=PK.fl[k]&&now-PK.fl[k]<450;x.fillStyle=pkcol(m);x.globalAlpha=hot?1:.82;x.fillRect(bx-w/2,by+(hot?4:0),w,d.bin-(hot?4:0));x.globalAlpha=1;x.fillStyle='#0b1220';x.font='bold '+(d.n>13?10:12)+'px sans-serif';x.textAlign='center';x.fillText(XM(m).replace('×',''),bx,by+d.bin/2+5+(hot?2:0))}
const keep=[];for(const b of PK.balls){const q=pkball(b,now);if(!q){PK.fl[b.k]=now;sp=Math.max(0,sp-1);setBal(BAL+b.pay);PK.hist.unshift([b.m,b.pay-b.a]);if(PK.hist.length>14)PK.hist.pop();pkhr();continue}keep.push(b);const g=x.createRadialGradient(q[0]-q[2]/3,q[1]-q[2]/3,1,q[0],q[1],q[2]);g.addColorStop(0,'#fff7ae');g.addColorStop(1,'#f59e0b');x.fillStyle=g;x.beginPath();x.arc(q[0],q[1],q[2],0,7);x.fill()}
PK.balls=keep;if(keep.length||Object.values(PK.fl).some(t=>now-t<500))PK.raf=raf(pkloop)}
function pkhr(){const e=$('#pkh');if(e)e.innerHTML=PK.hist.map(h=>`<span class=pkc2 style="background:${pkcol(h[0])}">${XM(h[0])}</span>`).join('')}
async function pkdrop(){const b=bet();if(!b)return;const r=await go('plinko/drop',{amt:b,rows:PK.rows,risk:PK.risk},b);if(!r)return;sp++;const o=[0];for(const s of r.path)o.push(o[o.length-1]+(s?1:-1));PK.balls.push({k:r.k,m:r.m,pay:r.pay,a:b,o,t0:Date.now(),step:170,d:pkd()});if(!PK.raf)PK.raf=raf(pkloop)}

async function vpgo(){if(VP&&VP.on){try{const r=await api('vp/draw',{hold:VP.hold});VP.on=0;VP.hand=r.hand;VP.hold=[0,0,0,0,0];vpr(r.name);done(VP.a,r,r.name+(r.m?' · '+r.m+'×':''))}catch(e){say(e,'bad')}return}const b=bet();if(!b)return;const r=await go('vp/deal',{amt:b},b);if(!r)return;VP={on:1,a:b,hand:r.hand,hold:[0,0,0,0,0],cur:r.cur[0]};say(r.cur[1]?'You already have '+r.cur[0]:'');vpr()}

V['Keno']=`<h2>🔢 Keno</h2><p>Pick up to 10 numbers. 10 of 40 numbers are drawn. The more you match, the more you win.</p><div class=row><label>Risk <select id=knr onchange=knset()><option value=low>Low</option><option value=classic selected>Classic</option><option value=high>High</option></select></label><button onclick=knauto()>Auto pick</button><button onclick=knclr()>Clear</button><button class=go id=knb onclick=knplay()>Play</button></div><div class=kg id=kg></div><div class=kt id=kt></div>`;
I['Keno']=async()=>{KN={pick:new Set(),risk:'classic',busy:0,draw:null};if(!KT){const r=await capi('keno/tbl');if(r)KT=r.t}knr()};
function knr(hit){const dr=KN.draw;$('#kg').innerHTML=[...Array(40)].map((_,i)=>{const n=i+1,s=KN.pick.has(n),d=dr&&dr.includes(n),c=s&&d?'kh':d?'kd':s?'ks':'';return `<button class="kn ${c}" onclick="knp(${n})">${n}</button>`}).join('');const k=KN.pick.size,t=KT&&KT[KN.risk]&&KT[KN.risk][k];$('#kt').innerHTML=k&&t?`<div class=ktr>${t.map((m,h)=>m>0?`<span class="${hit===h?'on':''}"><i>${h} hit${h==1?'':'s'}</i><b>${XM(m)}</b></span>`:'').join('')}</div>`:'<small>Pick 1 to 10 numbers to see the payouts.</small>'}
function knset(){if(KN.busy)return;KN.risk=$('#knr').value;knr()}
function knp(n){if(KN.busy)return;KN.draw=null;if(KN.pick.has(n))KN.pick.delete(n);else if(KN.pick.size<10)KN.pick.add(n);else toast('You can pick up to 10 numbers');knr()}
function knclr(){if(KN.busy)return;KN.pick=new Set();KN.draw=null;knr()}
function knauto(){if(KN.busy)return;KN.draw=null;const k=KN.pick.size||5;KN.pick=new Set();while(KN.pick.size<k)KN.pick.add(1+Math.floor(Math.random()*40));knr()}
async function knplay(){if(KN.busy)return;if(!KN.pick.size)return say('Pick at least one number','bad');const b=bet();if(!b)return;const r=await go('keno/play',{amt:b,risk:KN.risk,pick:[...KN.pick]},b);if(!r)return;KN.busy=1;sp=1;KN.draw=[];const sh=r.draw.slice().sort(()=>Math.random()-.5);for(const n of sh){KN.draw.push(n);knr();await sleep(110)}KN.draw=r.draw;knr(r.hits.length);sp=0;KN.busy=0;done(b,r,r.hits.length+' hit'+(r.hits.length==1?'':'s')+' · '+XM(r.m))}

const whc=m=>m===0?'#334155':m<1.6?'#2563eb':m<2.5?'#10b981':m<4?'#8b5cf6':m<10?'#f59e0b':m<20?'#ef4444':'#fbbf24';
V['Wheel']=`<h2>🎡 Wheel</h2><p>Spin the wheel. The pointer decides your multiplier. Pick a risk level first.</p><div class=row><label>Risk <select id=whr onchange=whset()><option value=low>Low</option><option value=med selected>Medium</option><option value=high>High</option></select></label><button class=go id=whb onclick=whspin()>Spin</button></div><div class=whw><div class=whp></div><svg id=whs viewBox="-110 -110 220 220" class=whs></svg></div>`;
I['Wheel']=async()=>{WR={rot:0,risk:'med',busy:0};if(!WHT){const r=await capi('wheel/tbl');if(r)WHT=r.t}whdraw()};
function whdraw(){const t=WHT&&WHT[WR.risk];if(!t)return;const n=t.length,a=2*Math.PI/n;let h='<g id=whg style="transform:rotate('+WR.rot+'deg);transition:transform 4.2s cubic-bezier(.12,.6,.1,1)">';t.forEach((m,i)=>{const a0=i*a-Math.PI/2,a1=(i+1)*a-Math.PI/2,x0=100*Math.cos(a0),y0=100*Math.sin(a0),x1=100*Math.cos(a1),y1=100*Math.sin(a1),mid=(a0+a1)/2;h+=`<path d="M0 0L${x0.toFixed(2)} ${y0.toFixed(2)}A100 100 0 0 1 ${x1.toFixed(2)} ${y1.toFixed(2)}Z" fill="${whc(m)}" stroke="#0b1220" stroke-width="1"/><text x="${(78*Math.cos(mid)).toFixed(1)}" y="${(78*Math.sin(mid)+3).toFixed(1)}" font-size="9" font-weight="800" fill="#fff" text-anchor="middle" transform="rotate(${(mid*180/Math.PI+90).toFixed(1)} ${(78*Math.cos(mid)).toFixed(1)} ${(78*Math.sin(mid)).toFixed(1)})">${m?XM(m).replace('×',''):''}</text>`});h+='<circle r="16" fill="#0b1220" stroke="#f7c948" stroke-width="3"/></g>';$('#whs').innerHTML=h}
function whset(){if(WR.busy){$('#whr').value=WR.risk;return}WR.risk=$('#whr').value;WR.rot=0;whdraw()}
async function whspin(){if(WR.busy)return;const b=bet();if(!b)return;const r=await go('wheel/spin',{amt:b,risk:WR.risk},b);if(!r)return;WR.busy=1;sp=1;const n=WHT[WR.risk].length,seg=360/n,cur=((WR.rot%360)+360)%360,want=(360-(r.i+.5)*seg+(Math.random()-.5)*seg*.6+360)%360;WR.rot+=360*6+((want-cur)+360)%360;const g=$('#whg');if(g)g.style.transform='rotate('+WR.rot+'deg)';await sleep(4400);WR.busy=0;sp=0;done(b,r,XM(r.m))}

V['Baccarat']=`<h2>🂠 Baccarat</h2><p>Bet on Player, Banker or a Tie. Closest to 9 wins. Player pays 1.95×, Banker pays 1.9×, Tie pays 8×. A tie returns Player and Banker bets.</p><div class=row style="justify-content:center">${[['P','Player','1.95×'],['T','Tie','8×'],['B','Banker','1.9×']].map(s=>`<button class="bcs${s[0]=='P'?' on':''}" id=bs${s[0]} onclick="bcside('${s[0]}')"><b>${s[1]}</b><small>${s[2]}</small></button>`).join('')}</div><div class=bcf id=bcf><div><small>Player</small><div class=bch id=bcp></div><b id=bcpt></b></div><div><small>Banker</small><div class=bch id=bcb></div><b id=bcbt></b></div></div><div class=row style="justify-content:center"><button class=go id=bcd onclick=bcplay()>Deal</button></div>`;

async function bcplay(){if(BC.busy)return;const b=bet();if(!b)return;const r=await go('bacc/play',{amt:b,side:BC.side},b);if(!r)return;BC.busy=1;sp=1;$('#bcp').innerHTML='';$('#bcb').innerHTML='';$('#bcpt').textContent='';$('#bcbt').textContent='';const seq=[['p',r.P[0]],['b',r.B[0]],['p',r.P[1]],['b',r.B[1]],['p',r.P[2]],['b',r.B[2]]].filter(x=>x[1]!==undefined);const sh={p:[],b:[]};for(const[w,c]of seq){sh[w].push(c);$(w=='p'?'#bcp':'#bcb').innerHTML=sh[w].map(x=>cardH(x)).join('');await sleep(520)}$('#bcpt').textContent=r.p;$('#bcbt').textContent=r.b;await sleep(300);sp=0;BC.busy=0;done(b,r,r.w=='T'?'Tie':r.w=='P'?'Player wins':'Banker wins')}

let TW=null;const TWD={easy:[4,1],medium:[3,1],hard:[2,1],expert:[3,2],master:[4,3]};
V['Tower']=`<h2>🗼 Tower</h2><p>Climb 8 floors. Pick one tile on each floor and avoid the bombs. Each safe floor raises your multiplier. Cash out any time.</p><div class=row><label>Difficulty <select id=twd onchange=twshow()><option value=easy>Easy (1 bomb in 4)</option><option value=medium selected>Medium (1 in 3)</option><option value=hard>Hard (1 in 2)</option><option value=expert>Expert (2 in 3)</option><option value=master>Master (3 in 4)</option></select></label><button class=go id=twb onclick=twgo()>Start</button><b id=twx></b></div><div class=twg id=twg></div>`;
I['Tower']=()=>{TW=null;twshow()};
const twx=(d,l)=>{const[c,n]=TWD[d];return .9*Math.pow(c/(c-n),l)};
function twshow(){const d=TW?TW.d:$('#twd').value,[cols]=TWD[d];let h='';for(let r=7;r>=0;r--){h+=`<div class="twr${TW&&TW.on&&TW.l==r?' act':''}"><span class=twm>${XM(twx(d,r+1))}</span><div class=twt style="grid-template-columns:repeat(${cols},1fr)">`;for(let c=0;c<cols;c++){const pk=TW&&TW.picks[r]===c,bm=TW&&TW.bombs&&TW.bombs[r]&&TW.bombs[r].includes(c);h+=`<button class="tt${pk?' safe':''}${bm?' bomb':''}" ${TW&&TW.on&&TW.l==r&&!TW.q?'':'disabled'} onclick="twp(${c})">${pk?GEM:bm?BOMB:''}</button>`}h+='</div></div>'}$('#twg').innerHTML=h}
async function twgo(){if(TW&&TW.on){if(!TW.l||TW.q)return;TW.q=1;try{const r=await api('tower/cash');TW.on=0;TW.bombs=r.bombs;$('#twb').textContent='Start';$('#twd').disabled=false;twshow();done(TW.a,r,XM(r.x))}catch(e){say(e,'bad');TW.q=0}return}const b=bet();if(!b)return;const d=$('#twd').value,r=await go('tower/start',{amt:b,d},b);if(!r)return;TW={on:1,a:b,d,l:0,picks:[],bombs:null,q:0};$('#twb').textContent='Cash out';$('#twd').disabled=true;$('#twx').textContent='1.00×';say('');twshow()}
async function twp(c){if(!TW||!TW.on||TW.q)return;TW.q=1;try{const r=await api('tower/pick',{c});TW.q=0;if(r.boom){TW.on=0;TW.bombs=r.bombs;TW.picks[TW.l]=undefined;$('#twb').textContent='Start';$('#twd').disabled=false;twshow();return done(TW.a,{bal:r.bal,pay:0},'Boom')}TW.picks[TW.l]=c;TW.l++;$('#twx').textContent=r.x.toFixed(2)+'×';if(r.done){TW.on=0;TW.bombs=r.bombs;$('#twb').textContent='Start';$('#twd').disabled=false;twshow();return done(TW.a,r,'Top of the tower '+XM(r.x))}twshow()}catch(e){TW.q=0;say(e,'bad')}}

async function scbuy(){if(SC&&SC.on)return;const b=bet();if(!b)return;const r=await go('scratch/play',{amt:b},b);if(!r)return;sp=1;SC={on:1,a:b,r,rev:Array(9).fill(false)};say('Scratch the tiles!');scr()}

function pedit(id){const p=POLLS.find(x=>x.id==id);if(!p)return;PEID=id;PQ=p.q;PO=p.o.map((o,i)=>({t:o.t,c:o.c,i}));prr()}
async function psavePoll(){pread();const ms=$('#pdur').value.trim()?pd($('#pdur').value):undefined;if(!PQ.trim())return toast('Type the question');if(PO.filter(o=>o.t.trim()).length<2)return toast('Fill in at least 2 options');if(!PEID&&!(ms>=10000))return toast('Type a time like 10m, 2h or 1d');if(ms!==undefined&&!(ms>=10000))return toast('Use a time like 10m, 2h or 1d');const r=PEID?await adm('polledit',{id:PEID,q:PQ,o:PO.map(o=>({t:o.t,c:o.c,i:o.i})),ms}):await adm('pollnew',{q:PQ,o:PO.map(o=>({t:o.t,c:o.c})),ms});if(r){toast(PEID?'Poll updated':'Poll is live');pcancel();setTimeout(openAdmin,300)}}
async function pendp(id){const r=await adm('pollend',{id});if(r){toast('Poll ended');setTimeout(openAdmin,300)}}
async function pdelp(id){const r=await adm('polldel',{id});if(r){toast('Poll deleted');setTimeout(openAdmin,300)}}
function mailAdm(popt){return `<div class=as><h3>Send mail</h3><div class=row><select id=ml style="flex:1;min-width:0"><option value=all>All players</option>${popt}</select></div><input id=mt maxlength=60 placeholder="Title" style="width:100%"><textarea id=mbd2 maxlength=500 rows=3 placeholder="Message (updates, news…)"></textarea><div class=row><button class=go onclick=amail()>Send mail</button></div><small>Shows in the player's mailbox with a red ! until they read it. You can also type /mail all | Title | Message in the command box.</small></div>`}
async function amail(){const t=$('#mt').value.trim(),b=$('#mbd2').value.trim();if(!t||!b)return toast('Type a title and a message');const r=await adm('mail',{to:$('#ml').value,title:t,body:b});if(r){toast('Mail sent to '+r.n+' player'+(r.n==1?'':'s'));$('#mt').value='';$('#mbd2').value=''}}
// profile pictures
function pfpPick(inp){const f=inp.files&&inp.files[0];if(!f)return;if(f.size>8e6)return toast('That image is too big');const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=async()=>{const cv=document.createElement('canvas');cv.width=cv.height=96;const x=cv.getContext('2d'),s=Math.min(im.width,im.height);x.fillStyle='#222';x.fillRect(0,0,96,96);x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,96,96);let q=.85,d='';for(let i=0;i<6;i++){d=cv.toDataURL('image/jpeg',q).split(',')[1];if(d.length<13000)break;q-=.15}const r=await capi('pfp/set',{img:d});if(r){toast('Profile picture updated');openP(MY.id)}};im.onerror=()=>toast('Could not read that image');im.src=fr.result};fr.readAsDataURL(f)}
async function pfpClear(){const r=await capi('pfp/clear');if(r){toast('Picture removed');openP(MY.id)}}
async function mrempfp(id){const r=await mapi('mod/rempfp',{to:id});if(r){toast('Picture removed');cls()}}

const mtBtns=()=>names.map(n=>`<button class="${MT[n]?'lk':''}" onclick="alock('${n}')">${MT[n]?'LOCKED · ':''}${n}</button>`).join('')+(Object.keys(MT).length?'<button class=dng onclick="aunlockAll()">Unlock all</button>':'');

async function alock(n){const r=await adm('lock',{game:n,on:!MT[n]});if(r)toast(r.nm)}

// private messages
function dmAdd(m){const e=$('#dmm');if(!e)return;const me=m.u==MY.id;e.insertAdjacentHTML('beforeend',`<div class="dmb${me?' me':''}">${esc(m.x)}<small>${new Date(m.ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</small></div>`);e.scrollTop=e.scrollHeight}
async function dmOpen(){const r=await capi('dm/list');if(!r)return;DMV.id='';DMV.open=true;const bl=(r.blk||[]);ov(`<div id=dml style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">Messages</h2><button onclick=cls()>Close</button></div><div class=row style="margin-top:10px"><input id=dmq placeholder="Find a player to message" style="flex:1;min-width:0" autocomplete=off onkeydown="if(event.key=='Enter')dmFind()"><button class=go onclick=dmFind()>Chat</button></div>${r.l.length?r.l.map(c=>`<div class="dmr${c.un?' un':''}" onclick="dmThread('${sid(c.p)}')">${av((PL[c.p]||{}).color||'#888',34,c.p)}<div style="min-width:0;flex:1"><b>${esc(nm(c.p))}</b><br><small>${c.me?'You: ':''}${esc(c.x)}</small></div>${c.un?'<i class=dun>!</i>':''}</div>`).join(''):'<p>No messages yet. Search a name above, or open anyone\'s profile and press Message.</p>'}${bl.length?`<h3 style="margin:14px 0 6px">Blocked players</h3><small>You do not see messages from these players. Nothing else changes.</small>${bl.map(id=>`<div class=row style="justify-content:space-between"><span>${esc(nm(id))}</span><button onclick="dmBlock('${sid(id)}',false,1)">Unblock</button></div>`).join('')}`:''}`)}
function dmFind(){const p=findP($('#dmq').value);if(p){if(p.id==MY.id)return toast('Pick another player');dmThread(p.id)}}
async function dmThread(id){const r=await capi('dm/get',{with:id});if(!r)return;DMV.id=id;DMV.open=true;const p=PL[id]||{};ov(`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><button onclick=dmOpen()>◀ Back</button><div style="display:flex;gap:8px;align-items:center;cursor:pointer;min-width:0" onclick="openP('${sid(id)}')">${av(p.color||'#888',30,id)}<b style="overflow:hidden;text-overflow:ellipsis">${esc(nm(id))}</b></div><button onclick=cls()>Close</button></div>${r.blocked?`<p style="margin:12px 0">You blocked this player, so you do not see their messages. They are not told.</p><div class=row><button class=go onclick="dmBlock('${sid(id)}',false)">Unblock</button></div>`:`<div id=dmm></div><div class=row><input id=dmt maxlength=300 placeholder="Write a message…" style="flex:1;min-width:0" autocomplete=off onkeydown="if(event.key=='Enter')dmSend()"><button class=go onclick=dmSend()>Send</button></div><div class=row><button class=dng onclick="dmBlock('${sid(id)}',true)">Block this player</button></div>`}`);if(!r.blocked){r.m.forEach(dmAdd);const t=$('#dmt');t&&t.focus&&t.focus()}}
async function dmSend(){const i=$('#dmt'),x=i.value.trim();if(!x)return;const r=await capi('dm/send',{to:DMV.id,text:x});if(r){i.value='';dmAdd(r.m)}}
async function dmBlock(id,on,back){const r=await capi('dm/block',{to:id,on});if(r){toast(on?'Blocked. You will not see their messages.':'Unblocked');back?dmOpen():dmThread(id)}}
// mailbox
async function mailOpen(){const r=await capi('mail/list');if(!r)return;const l=r.mail;ov(`<div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">Mailbox</h2><button onclick=cls()>Close</button></div>${l.length?`<div class=row><button onclick="mailDel('all')">Delete all</button></div>`:''}${l.map(m=>`<div class="mail${m.r?'':' new'}"><b>${esc(m.title)}</b><br><small>From ${esc(m.from||'System')} · ${new Date(m.ts).toLocaleString()}</small><p>${esc(m.body)}</p><div class=row>${m.cid?`<button class=go onclick="mailAcc('${sid(m.id)}')">Accept invite</button>`:''}<button onclick="mailDel('${sid(m.id)}')">Delete</button></div></div>`).join('')||'<p>No mail yet.</p>'}`,'cl');if(MY.mu>0){MY.mu=0;mailBadge();capi('mail/read',{id:'all'})}}

const BNP=[['#e11d48','#7f1d1d','#fde68a',0],['#2563eb','#1e3a8a','#bfdbfe',1],['#16a34a','#14532d','#bbf7d0',2],['#9333ea','#4c1d95','#e9d5ff',3],['#f59e0b','#92400e','#fef3c7',4],['#0ea5e9','#0c4a6e','#e0f2fe',5],['#111827','#374151','#f87171',0],['#ec4899','#831843','#fbcfe8',1],['#14b8a6','#134e4a','#ccfbf1',2],['#f97316','#7c2d12','#ffedd5',3],['#84cc16','#365314','#ecfccb',4],['#6366f1','#312e81','#c7d2fe',5],['#ef4444','#111827','#fecaca',2],['#eab308','#1f2937','#fef9c3',3],['#06b6d4','#581c87','#cffafe',0],['#f1f5f9','#475569','#ef4444',1]];
const BNE=['<path d="M30 80 34 48 48 64 60 42 72 64 86 48 90 80z"/>','<path d="M66 28 38 72h20l-6 28 32-46H64z"/>','<path d="M60 28c10 18 26 28 20 48-4 14-14 22-20 22-10 0-20-8-20-22 0-12 10-16 12-30 4 6 6 8 8-18z"/>','<path d="m60 28 9 20 22 3-16 15 4 22-19-11-19 11 4-22-16-15 22-3z"/>','<path d="M60 28 90 62 60 98 30 62z"/>','<circle cx="60" cy="58" r="24"/><rect x="48" y="76" width="24" height="16" rx="3"/>','<path d="M57 24h6v50h-6zM44 70h32v6H44zM57 76h6v16h-6z"/>','<path d="M72 30a30 30 0 1 0 14 52A24 24 0 1 1 72 30z"/>'];
let bnc=0;function bnr(i,w=60){i=((+i||0)%16+16)%16;const[a,b,e,p]=BNP[i],id='bc'+i+'_'+(bnc++),h=Math.round(w*1.25);let pat='';if(p==0)for(let k=0;k<6;k++)pat+=`<rect x="${k*24}" y="0" width="12" height="150" fill="${b}" opacity=".5"/>`;if(p==1)pat=`<path d="M0 0H120V150Z" fill="${b}" opacity=".6"/>`;if(p==2)for(let k=0;k<4;k++)pat+=`<rect x="0" y="${k*40}" width="120" height="18" fill="${b}" opacity=".5"/>`;if(p==3)for(let k=0;k<4;k++)pat+=`<path d="M0 ${20+k*34}L60 ${50+k*34}L120 ${20+k*34}" stroke="${b}" stroke-width="12" fill="none" opacity=".55"/>`;if(p==4)for(let k=0;k<12;k++)pat+=`<circle cx="${16+(k%4)*29}" cy="${18+Math.floor(k/4)*50}" r="8" fill="${b}" opacity=".55"/>`;if(p==5)for(let k=0;k<30;k++)if((k+Math.floor(k/5))%2)pat+=`<rect x="${(k%5)*24}" y="${Math.floor(k/5)*25}" width="24" height="25" fill="${b}" opacity=".5"/>`;return `<svg width="${w}" height="${h}" viewBox="0 0 120 150" style="flex:none"><defs><clipPath id="${id}"><path d="M4 4H116V118L60 146L4 118Z"/></clipPath></defs><path d="M4 4H116V118L60 146L4 118Z" fill="${a}"/><g clip-path="url(#${id})">${pat}</g><path d="M4 4H116V118L60 146L4 118Z" fill="none" stroke="${e}" stroke-width="5"/><g fill="${e}" stroke="${b}" stroke-width="2">${BNE[i%8]}</g></svg>`}

const LOCK='<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="vertical-align:-2px"><path d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5zm-3 5a3 3 0 0 1 6 0v3H9z"/></svg>';
async function clansOpen(tab){CLV.tab=tab||(MY.cid?'mine':'list');await clansLoad()}
async function clansLoad(){const r=await capi('clan/list');if(!r)return;CLV.list=r.list;CLV.mine=r.mine;MY.cid=r.mine;if(CLV.tab=='mine'){if(!r.mine)CLV.tab='list';else{const g=await capi('clan/get',{id:r.mine});if(g)CLV.c=g.c;else CLV.tab='list'}}if(CLV.tab=='view'){const g=await capi('clan/get',{id:CLV.id});if(g)CLV.c=g.c;else CLV.tab='list'}clansR()}
function ctabs(){const t=[['list','All clans'],[MY.cid?'mine':'create',MY.cid?'My clan':'Create clan'],['top','Clan leaderboard']];return `<div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">Clans</h2><button onclick=cls()>Close</button></div><div class=ctab style="margin-top:10px">${t.map(x=>`<button class="${CLV.tab==x[0]?'on':''}" onclick="ctab('${x[0]}')">${x[1]}</button>`).join('')}</div>`}
async function ctab(t){CLV.tab=t;if(t=='mine'||t=='list'||t=='top')await clansLoad();else clansR()}
const TOPT=()=>tagH('CLAN1');
function clansR(){let h=ctabs();const t=CLV.tab;
if(t=='list')h+=CLV.list.length?CLV.list.map(c=>clanCard(c)).join(''):'<p>No clans yet. Be the first! Creating one costs $1T.</p>';
else if(t=='top')h+=`<p>Ranked by money earned from gambling inside the clan (gifts and starting money do not count). The #1 clan gets the ${TOPT()} tag.</p>`+(CLV.list.length?CLV.list.map((c,i)=>`<div class=lbrow onclick="cview('${sid(c.id)}')" style="cursor:pointer"><b class=n>${i+1}</b>${bnr(c.banner,34)}<div style="flex:1;min-width:0"><b>${esc(c.name)}</b>${c.top?TOPT():''}<br><small>${c.n}/${c.max} members</small></div><b>${FC(c.money)}</b></div>`).join(''):'<p>No clans yet.</p>');
else if(t=='create')h+=createH();
else if((t=='mine'||t=='view')&&CLV.c)h+=clanV(CLV.c);
ov(h,'cl');CLV.open=true;if(t=='mine'||t=='view')cchatR()}
function clanCard(c){const own=c.id==CLV.mine,full=c.n>=c.max;let btn='';if(own)btn=`<button class=go onclick="ctab('mine')">Open</button>`;else if(CLV.mine)btn='<small>You are in a clan</small>';else if(full)btn='<button disabled>Full</button>';else if(c.priv)btn=`<button class="${c.req?'':'go'}" onclick="creq('${sid(c.id)}')">${c.req?'Cancel request':'Request to join'}</button>`;else btn=`<button class=go onclick="cjoin('${sid(c.id)}')">Join</button>`;
return `<div class=ccard>${bnr(c.banner,46)}<div class=ci onclick="cview('${sid(c.id)}')" style="cursor:pointer"><b>${esc(c.name)}</b> ${c.priv?LOCK+' <small>Private</small>':'<small>Public</small>'}${c.top?TOPT():''}<br><small>${esc(c.desc||'No description')}</small><br><small>${c.n}/${c.max} members · ${FC(c.money)} earned · owner ${esc(nm(c.owner))}</small></div>${btn}</div>`}
async function cview(id){CLV.id=id;CLV.tab=(id==CLV.mine)?'mine':'view';await clansLoad()}
async function cjoin(id){const r=await capi('clan/join',{id});if(r){MY.cid=r.id;toast('You joined the clan!');clansOpen('mine')}}
async function creq(id){const r=await capi('clan/request',{id});if(r){toast(r.on?'Request sent to the clan owner':'Request cancelled');clansLoad()}}
function createH(){const bg=Array.from({length:16},(_,i)=>`<button class="${CLV.bn==i?'on':''}" onclick="cbn(${i})">${bnr(i,52)}</button>`).join('');return `<h3 style="margin:6px 0">Create a clan</h3><p>Costs <b>$1T</b>. You can only be in one clan at a time.</p><input id=cn1 maxlength=16 placeholder="Clan name (3 to 16 characters, must be unique)" value="${esc(CLV.nm)}" style="width:100%"><input id=cd1 maxlength=100 placeholder="Description" value="${esc(CLV.ds)}" style="width:100%;margin-top:8px"><h3 style="margin:12px 0 4px">Choose a banner</h3><div class=bngrid id=bng>${bg}</div><div class=row><b>Max players</b>${[3,4,5].map(n=>`<button class="${CLV.max==n?'go':''}" onclick="cmax(${n})">${n}</button>`).join('')}<b style="margin-left:10px">Privacy</b><button class="${CLV.priv?'':'go'}" onclick="cpriv(0)">Public</button><button class="${CLV.priv?'go':''}" onclick="cpriv(1)">Private</button></div><small>Public clans can be joined by anyone while there is room. Private clans need the owner to accept a request or send an invite.</small><div class=row><button class=go onclick=ccreate()>Create clan for $1T</button></div>`}
function csync(){const a=$('#cn1'),b=$('#cd1');if(a)CLV.nm=a.value;if(b)CLV.ds=b.value}
function cbn(i){csync();CLV.bn=i;clansR()}function cmax(n){csync();CLV.max=n;clansR()}function cpriv(v){csync();CLV.priv=!!v;clansR()}
async function ccreate(){csync();const r=await capi('clan/create',{name:CLV.nm,desc:CLV.ds,banner:CLV.bn,max:CLV.max,priv:CLV.priv});if(r){setBal(r.bal);MY.cid=r.id;toast('Clan created!',1);CLV.nm=CLV.ds='';clansOpen('mine')}}
function clanV(c){const mem=c.mem.slice().sort((a,b)=>(b.w||0)-(a.w||0));let h=`<div style="display:flex;gap:14px;align-items:center">${bnr(c.banner,84)}<div style="min-width:0"><h2 style="margin:0">${esc(c.name)}${c.top?TOPT():''}</h2><small>${c.priv?LOCK+' Private':'Public'} · ${c.n}/${c.max} members</small><br><b>${FC(c.money)}</b> <small>clan money (from gambling wins)</small><p style="margin:4px 0">${esc(c.desc||'')}</p></div></div>`;

if(!c.mine){h+=CLV.mine?'<p><small>You are already in a clan.</small></p>':c.n>=c.max?'<p>This clan is full.</p>':c.priv?`<div class=row><button class="${c.req?'':'go'}" onclick="creqv('${sid(c.id)}')">${c.req?'Cancel request':'Request to join'}</button></div>`:`<div class=row><button class=go onclick="cjoin('${sid(c.id)}')">Join clan</button></div>`;return h}
h+=`<h3 style="margin:12px 0 4px">Clan chat</h3><div class=cch id=cch></div><div class=row><input id=ccin maxlength=200 placeholder="Message your clan…" style="flex:1;min-width:0" onkeydown="if(event.key=='Enter')csend2()"><button class=go onclick=csend2()>Send</button></div><small>Only members of this clan can see this chat. Clan ranks are based on what you wager while in the clan and only show here.</small>`;
if(c.isO){const inv=Object.values(PL).filter(p=>p.id!=MY.id&&!c.mem.some(m=>m.id==p.id)).sort((a,b)=>String(a.name).localeCompare(b.name)).map(p=>`<option value="${sid(p.id)}">${esc(p.name)}</option>`).join('');

function cchatR(){const e=$('#cch');if(!e||!CLV.c||!CLV.c.chat)return;const c=CLV.c;e.innerHTML=c.chat.map(m=>{const mm=c.mem.find(x=>x.id==m.u),ri=rankOf(mm?mm.w:0);return `<div><small>${tm(m.ts)}</small> ${rkIcon(ri,14)} <b style="color:${col(m.u)}">${esc(nm(m.u))}</b>: ${esc(m.x)}</div>`}).join('')||'<small>No messages yet.</small>';e.scrollTop=e.scrollHeight}
async function csend2(){const i=$('#ccin'),t=i.value.trim();if(!t)return;i.value='';await capi('clan/chat',{text:t})}
async function ckick(id){if(!confirm('Kick '+nm(id)+' from the clan?'))return;if(await capi('clan/kick',{to:id}))clansLoad()}

async function cedpriv(v){if(await capi('clan/edit',{priv:!!v}))clansLoad()}
async function cedban(i){if(await capi('clan/edit',{banner:i}))clansLoad()}
async function cdisband(){if(!confirm('Disband this clan? This cannot be undone and the clan money is lost.'))return;if(await capi('clan/disband')){MY.cid='';toast('Clan disbanded');CLV.tab='list';clansLoad()}}
async function cleave(){if(!confirm('Leave this clan?'))return;if(await capi('clan/leave')){MY.cid='';CLV.tab='list';clansLoad()}}
async function creqv(id){if(await capi('clan/request',{id}))clansLoad()}
shelf();homeR();cs(1);boot();
</script></body></html>
